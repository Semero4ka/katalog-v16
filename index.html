<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--blue:#1a6bff;--bg:#f2f5f8;--card:#fff;--line:#dfe6ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#1c2733;padding-bottom:70px}
header{background:var(--blue);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tab{background:rgba(255,255,255,.22);color:#fff;border:none;border-radius:22px;padding:9px 16px;font-size:15px;cursor:pointer}
.tab.on{background:#fff;color:var(--blue);font-weight:700}
main{max-width:860px;margin:0 auto;padding:12px}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;display:flex;gap:11px;align-items:center}
.icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#eef2f7}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;word-break:break-word}
.meta{font-size:13px;color:#5b6b7b;margin-top:3px}
.stock0{color:#d23;font-weight:600}
.stocknd{color:#93a3b3}
.row2{display:flex;align-items:center;gap:7px;flex-shrink:0}
.qty{width:52px;padding:7px 5px;text-align:center;border:1px solid var(--line);border-radius:9px;font-size:15px}
.btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer}
.btn.gray{background:#e6ecf3;color:#2a3a4a}
.btn.red{background:#e5484d}
.btn.sm{padding:7px 10px;font-size:13px}
.empty{padding:36px 14px;text-align:center;color:#5b6b7b;font-size:15px}
.more{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;margin:8px 0}
.err{position:fixed;bottom:0;left:0;right:0;background:#b3261e;color:#fff;padding:10px 14px;font-size:13px;z-index:99;word-break:break-word;display:none}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:40}
.total{font-size:16px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin:10px 0}
.tbl th,.tbl td{border:1px solid #444;padding:6px 8px;font-size:14px}
.tbl th{background:#f0f0f0}
.inv{background:#fff;padding:16px;border-radius:12px}
.inv h2{font-size:19px;margin-bottom:12px}
.inv .kv{margin:6px 0;font-size:15px}
.inv .lbl{display:inline-block;width:110px}
.sign{display:flex;justify-content:space-between;margin-top:18px;font-size:14px;gap:10px;flex-wrap:wrap}
.sign input{border:none;border-bottom:1px solid #999;font-size:14px;padding:3px 6px;width:180px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chk{width:20px;height:20px;flex-shrink:0}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
.mbox h3{margin-bottom:12px}
.mbox label{display:block;font-size:13px;color:#5b6b7b;margin:10px 0 4px}
.mbox input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media print{
 body{background:#fff;padding:0}
 header,.tabs,.cartbar,.acts,.search,.chips,.more,.err,.cartbar,nav{display:none!important}
 .inv{border:none;padding:0}
 main{max-width:100%}
}
</style>
</head>
<body>
<header>
 <div class="logo">📦 Каталог</div>
 <div class="tabs">

</div>
<div class="err" id="errbar"></div>
<div class="modal" id="modal">

  </div>
 </div>
</div>

<script>
'use strict';
var CATS = CATDATA.cats, ITEMS = CATDATA.items;
var PORT = 40, shown = PORT;
var state = { view:'catalog', q:'', cat:-1, cart:{}, sel:{} };

/* ---------- хранилище (старые и новые ключи) ---------- */
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function loadCart(){ var c = lsGet('catalog_cart'); if(!c) c = lsGet('katalog_cart'); state.cart = c||{}; }
function saveCart(){ lsSet('catalog_cart', state.cart); }
function loadSettings(){
  var s = lsGet('catalog_settings')||lsGet('katalog_settings')||{};
  return { supplier: s.supplier||'поставщик', buyer: s.buyer||'', released: s.released||'Межлумян Л.Г.', invnum: s.invnum||1 };
}
function saveSettings(s){ lsSet('catalog_settings', s); lsSet('katalog_settings', s); }
function loadOrders(){ var o = lsGet('catalog_orders'); if(!o) o = lsGet('katalog_orders'); return o||[]; }
function saveOrders(o){ lsSet('catalog_orders', o); lsSet('katalog_orders', o); }
function nextInvNum(){ var s=loadSettings(); var n=parseInt(s.invnum)||1; s.invnum=n+1; saveSettings(s); return n; }

/* ---------- ошибки не молчим ---------- */
function showErr(msg){ var b=document.getElementById('errbar'); b.style.display='block'; b.textContent='Ошибка: '+msg; }
function showNote(msg){ var b=document.getElementById('errbar'); b.style.display='block'; b.textContent=msg; }
window.onerror = function(m){ showErr(String(m)); return true; };

/* ---------- иконки по категориям ---------- */
var ICONS = {'БАКАЛЕЯ':'🥫','БАТОНЧИКИ':'🍫','БЫТОВЫЕ ТОВАРЫ':'🧴','ВОДА':'💧','ЖЕВАТЕЛЬНАЯ РЕЗИНКА':'🍬','ЗАМОРОЗКА':'❄️','ЗЕФИР':'🍡','КИНДЕР':'🎁','КОНДИТЕРСКИЕ ИЗДЕЛИЯ':'🧁','КОНФЕТЫ В КОРОБКАХ':'🍫','КОНФЕТЫ ВЕСОВЫЕ':'🍬','КОРМ':'🐾','КОФЕ':'☕','КРУПЫ ВЕСОВЫЕ':'🌾','КРУПЫ ФАСОВКА':'🌾','КУКУРУЗНЫЕ ПАЛОЧКИ':'🌽','ЛЕДЕНЦЫ':'🍭','ЛЕТО':'☀️','МАКАРОНЫ':'🍝','МОЛОЧНЫЕ ПРОДУКТЫ':'🥛','МОРОЖЕНОЕ':'🍦','НАША ФАСОВКА':'🥡','ПЕЧЕНЬЕ':'🍪','ПЕЧЕНЬЕ ВЕСОВОЕ':'🍪','ПРЕСЕРВА':'🐟','ПРИПРАВЫ':'🧂','СМЕСЬ ПРИПРАВ':'🧂','РАСТИТЕЛЬНОЕ МАСЛО':'🫒','РЫБА':'🐟','РЫБНЫЕ КОНСЕРВЫ':'🐟','СОКИ':'🧃','СОЛЕНЬЯ':'🥒','СУХИЕ ЗАВТРАКИ':'🥣','СЫР ВЕСОВОЙ':'🧀','ТОППИНГИ И СИРОПЫ':'🍯','ЧАЙ':'🍵','ШОКОЛАД':'🍫','ЭНЕРГЕТИКИ':'⚡','ЯШКИНО':'🍪'};
function icon(cat){ return ICONS[CATS[cat]] || '📦'; }
function unit(cat){ return /ВЕСОВ|ВЕС\/|ВЕС$/.test(CATS[cat]) ? 'кг' : 'шт'; }

function fmt(n){ return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ---------- каталог ---------- */
function filtered(){
  var q = state.q.toLowerCase().trim(), out=[];
  for(var i=0;i<ITEMS.length;i++){
    var it=ITEMS[i];
    if(state.cat>=0 && it.c!==state.cat) continue;
    if(q && it.n.toLowerCase().indexOf(q)<0) continue;
    out.push(i);
  }
  return out;
}
function stockHtml(it){
  if(it.st===undefined||it.st===null) return '<div class="meta stocknd">Остаток: нет данных</div>';
  if(it.st<=0) return '<div class="meta stock0">Нет в наличии</div>';
  return '<div class="meta">Остаток: '+fmt(it.st)+' '+it.su+'</div>';
}
function renderCatalog(){
  var app=document.getElementById('app'), ids=filtered(), h='';
  h+='<input class="search" id="search" placeholder="Поиск товара…" value="'+state.q.replace(/"/g,'&quot;')+'">';
  h+='<div class="chips"><span class="chip'+(state.cat<0?' on':'')+'" data-act="cat" data-c="-1">Все</span>';
  for(var c=0;c<CATS.length;c++) h+='<span class="chip'+(state.cat===c?' on':'')+'" data-act="cat" data-c="'+c+'">'+CATS[c]+'</span>';
  h+='</div>';
  if(!ids.length) h+='<div class="empty">Товаров не найдено. Измените поиск или категорию.</div>';
  var end=Math.min(shown,ids.length);
  for(var k=0;k<end;k++){
    var i=ids[k], it=ITEMS[i];
    h+='<div class="card"><div class="icon">'+icon(it.c)+'</div>'
      +'<div class="info"><div class="name">'+esc(it.n)+'</div>'
      +'<div class="meta">'+fmt(it.p)+' ₽ / '+unit(it.c)+'</div>'+stockHtml(it)+'</div>'
      +'<div class="row2"><button class="btn sm gray" data-act="dec" data-i="'+i+'">−</button>'
      +'<input class="qty" id="q'+i+'" type="number" min="0" step="0.001" value="'+(state.cart[i]||0)+'" data-act="qty" data-i="'+i+'">'
      +'<button class="btn sm" data-act="inc" data-i="'+i+'">+</button>'
      +'<button class="btn sm" data-act="add" data-i="'+i+'">В корзину</button></div></div>';
  }
  if(ids.length>shown) h+='<button class="more" data-act="more">Показать ещё ('+(ids.length-shown)+')</button>';
  app.innerHTML=h;
  var s=document.getElementById('search');
  if(s){ s.addEventListener('input', function(){ state.q=this.value; shown=PORT; renderCatalog(); var ns=document.getElementById('search'); ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length); }); }
  updateBar();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- корзина ---------- */
function cartSum(){ var s=0; for(var k in state.cart){ var it=ITEMS[k]; if(it) s+=state.cart[k]*it.p; } return s; }
function updateBar(){ var n=0,s=0; for(var k in state.cart){ if(state.cart[k]>0){n++; s+=state.cart[k]*ITEMS[k].p;} } var bar=document.getElementById('cartbar'); bar.style.display=(state.view==='catalog'&&n>0)?'flex':'none'; document.getElementById('carttotal').textContent=fmt(s)+' ₽ · '+n+' поз.'; }
function renderCart(){
  var app=document.getElementById('app'), keys=Object.keys(state.cart).filter(function(k){return state.cart[k]>0;});
  if(!keys.length){ app.innerHTML='<div class="empty">Корзина пуста. Добавьте товары из каталога.</div>'; return; }
  var h='', total=0;
  keys.forEach(function(k){ var it=ITEMS[k]; var q=state.cart[k], s=q*it.p; total+=s;
    h+='<div class="card"><div class="icon">'+icon(it.c)+'</div><div class="info"><div class="name">'+esc(it.n)+'</div><div class="meta">'+fmt(it.p)+' ₽ / '+unit(it.c)+' × '+q+' = '+fmt(s)+' ₽</div></div>'
      +'<div class="row2"><button class="btn sm gray" data-act="dec" data-i="'+k+'">−</button>'
      +'<input class="qty" type="number" min="0" step="0.001" value="'+q+'" data-act="qty" data-i="'+k+'">'
      +'<button class="btn sm" data-act="inc" data-i="'+k+'">+</button></div></div>';
  });
  h+='<div class="card" style="justify-content:space-between"><div class="total">Итого: '+fmt(total)+' ₽</div><button class="btn" data-act="checkout">Оформить заявку</button></div>';
  app.innerHTML=h; updateBar();
}

/* ---------- сумма прописью ---------- */
function rubWords(n){
  var r=Math.floor(n), k=Math.round((n-r)*100);
  var u=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
  var uf=['','одна','две'];
  var f=['','десять','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  var ft=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  var h=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  function tri(x,form){ var w=[]; if(x>=100){w.push(h[Math.floor(x/100)]); x%=100;} if(x>=20){w.push(f[Math.floor(x/10)]); x%=10;} if(x>=10){w.push(ft[x-10]); x=0;} if(x>0) w.push((form&&x<3)?uf[x]:u[x]); return w.join(' '); }
  function triForm(x,one,few,many){ var m=x%10, t=x%100; if(t>=11&&t<=14) return many; if(m===1) return one; if(m>=2&&m<=4) return few; return many; }
  var out=[];
  var mil=Math.floor(r/1000000), th=Math.floor(r%1000000/1000), rest=r%1000;
  if(mil) out.push(tri(mil,true)+' '+triForm(mil,'миллион','миллиона','миллионов'));
  if(th) out.push(tri(th,true)+' '+triForm(th,'тысяча','тысячи','тысяч'));
  if(rest) out.push(tri(rest,false));
  if(!out.length) out.push('ноль');
  var k2=(k<10?'0':'')+k;
  var rf=triForm(r,'рубль','рубля','рублей');
  var kf=triForm(k,'копейка','копейки','копеек');
  return out.join(' ')+' '+rf+' '+k2+' '+kf;
}

/* ---------- накладная ---------- */
function todayStr(){ var d=new Date(), m=d.getMonth()+1; return d.getDate()+'.'+(m<10?'0':'')+m+'.'+d.getFullYear(); }
function createOrder(){
  var keys=Object.keys(state.cart).filter(function(k){return state.cart[k]>0;});
  if(!keys.length){ showErr('Корзина пуста — сначала добавьте товары'); return; }
  var o={ id: nextInvNum(), date: todayStr(), status:'new',
    supplier: loadSettings().supplier, buyer: loadSettings().buyer, released: loadSettings().released, received:'',
    items: keys.map(function(k){ var it=ITEMS[k]; return {n:it.n, q:state.cart[k], u:it.su||unit(it.c), p:it.p}; }) };
  var orders=loadOrders(); orders.unshift(o); saveOrders(orders);
  state.cart={}; saveCart(); state.view='orders'; state.openId=o.id; renderOrders(); renderInvoice(o.id);
}
function orderTotal(o){ return o.items.reduce(function(s,x){ return s + x.q*x.p; },0); }
function invoiceHtml(o, edit){
  var h='<div class="inv" id="invoice"><h2>Реализация товаров № '+o.id+' от '+o.date+' г.</h2>';
  h+='<div class="kv"><span class="lbl">Поставщик:</span> '+(edit?'<input id="f-sup" value="'+esc(o.supplier||'')+'">':'<b>'+esc(o.supplier||'—')+'</b>')+'</div>';
  h+='<div class="kv"><span class="lbl">Покупатель:</span> '+(edit?'<input id="f-buy" value="'+esc(o.buyer||'')+'">':'<b>'+esc(o.buyer||'—')+'</b>')+'</div>';
  h+='<table class="tbl"><tr><th>№</th><th>Товар</th><th>Кол-во</th><th>ед.</th><th>Цена</th><th>Сумма</th></tr>';
  o.items.forEach(function(x,i){
    var s=x.q*x.p;
    h+='<tr><td>'+(i+1)+'</td><td>'+(edit?'<input style="width:100%" value="'+esc(x.n)+'" data-f="n'+i+'">':esc(x.n))+'</td>'
      +'<td>'+(edit?'<input style="width:70px" type="number" step="0.001" value="'+x.q+'" data-f="q'+i+'">':fmt(x.q))+'</td>'
      +'<td>'+(edit?'<select data-f="u'+i+'"><option'+(x.u==='шт'?' selected':'')+'>шт</option><option'+(x.u==='кг'?' selected':'')+'>кг</option></select>':x.u)+'</td>'
      +'<td>'+(edit?'<input style="width:80px" type="number" step="0.01" value="'+x.p+'" data-f="p'+i+'">':fmt(x.p))+'</td>'
      +'<td style="text-align:right">'+fmt(s)+'</td></tr>';
  });
  var t=orderTotal(o);
  h+='<tr><td colspan="5" style="text-align:right;font-weight:700">Итого:</td><td style="text-align:right;font-weight:700">'+fmt(t)+'</td></tr>';
  h+='<tr><td colspan="5" style="text-align:right">В том числе НДС:</td><td style="text-align:right">0</td></tr></table>';
  h+='<div class="kv">Всего наименований '+o.items.length+', на сумму '+fmt(t)+' руб.<br><b>'+rubWords(t)+'</b></div>';
  h+='<div class="sign"><div>Отпустил '+(edit?'<input id="f-rel" value="'+esc(o.released||'')+'">':'<u>'+(o.released||'________')+'</u>')+'</div><div>Получил '+(edit?'<input id="f-rec" value="'+esc(o.received||'')+'">':'<u>'+(o.received||'________')+'</u>')+'</div></div></div>';
  return h;
}

/* ---------- заявки ---------- */
function renderOrders(){
  if(state.openId!=null){ var o=loadOrders().find(function(x){return x.id===state.openId;}); if(o){ renderInvoice(state.openId); return; } state.openId=null; }
  var app=document.getElementById('app'), orders=loadOrders();
  var h='<div class="bar"><b>Заявки ('+orders.length+')</b>';
  if(orders.length){ h+='<label style="margin-left:auto;font-size:14px"><input type="checkbox" class="chk" data-act="sel-all" id="selall"> Выбрать все</label><button class="btn red sm" data-act="del-sel">🗑 Удалить выбранные</button>'; }
  h+='</div>';
  if(!orders.length) h+='<div class="empty">Заявок пока нет. Оформите заявку из корзины.</div>';
  orders.forEach(function(o){
    h+='<div class="card"><input type="checkbox" class="chk" data-act="sel" data-id="'+o.id+'"'+(state.sel[o.id]?' checked':'')+'>'
      +'<div class="info"><div class="name">Накладная № '+o.id+' от '+o.date+'</div>'
      +'<div class="meta">'+o.items.length+' поз. · '+fmt(orderTotal(o))+' ₽ · '+(o.status==='new'?'черновик':'оформлена')+'</div></div>'
      +'<div class="row2"><button class="btn sm" data-act="open-inv" data-id="'+o.id+'">Открыть</button>'
      +'<button class="btn sm red" data-act="del-inv" data-id="'+o.id+'">🗑</button></div></div>';
  });
  app.innerHTML=h; updateBar();
}
function renderInvoice(id){
  var o=loadOrders().find(function(x){return x.id===id;});
  if(!o){ showErr('Накладная № '+id+' не найдена'); state.openId=null; renderOrders(); return; }
  document.getElementById('app').innerHTML =
    '<div class="acts"><button class="btn gray sm" data-act="back">← К списку</button>'
    +'<button class="btn sm" data-act="edit-inv" data-id="'+id+'">✏️ Редактировать</button>'
    +'<button class="btn sm" data-act="print-inv">🖨 Печать/PDF</button>'
    +'<button class="btn sm" data-act="dl-inv" data-id="'+id+'">⬇ Скачать</button>'
    +'<button class="btn sm" data-act="mail-inv" data-id="'+id+'">✉ Email</button>'
    +'<button class="btn sm" data-act="share-inv" data-id="'+id+'">↗ Поделиться</button>'
    +'<button class="btn sm" data-act="onec-inv" data-id="'+id+'">📊 Для 1С</button></div>'
    + invoiceHtml(o, false);
  updateBar();
}
function renderInvoiceEdit(id){
  var o=loadOrders().find(function(x){return x.id===id;});
  if(!o){ showErr('Накладная не найдена'); return; }
  document.getElementById('app').innerHTML =
    '<div class="acts"><button class="btn gray sm" data-act="back">← Отмена</button>'
    +'<button class="btn sm" data-act="save-inv" data-id="'+id+'">💾 Сохранить</button></div>'
    + invoiceHtml(o, true);
  updateBar();
}
function collectEdit(id){
  var orders=loadOrders(), o=orders.find(function(x){return x.id===id;}); if(!o) return;
  function v(k){ var e=document.getElementById(k); return e?e.value:null; }
  o.supplier=v('f-sup')||o.supplier; o.buyer=v('f-buy')||o.buyer;
  o.released=v('f-rel')||o.released; o.received=v('f-rec')||'';
  o.items.forEach(function(x,i){
    var g=function(f){ var e=document.querySelector('[data-f="'+f+'"]'); return e?e.value:null; };
    var nn=g('n'+i); if(nn!==null) x.n=nn;
    var qq=parseFloat(String(g('q'+i)).replace(',','.')); if(!isNaN(qq)&&qq>=0) x.q=qq;
    var uu=g('u'+i); if(uu) x.u=uu;
    var pp=parseFloat(String(g('p'+i)).replace(',','.')); if(!isNaN(pp)&&pp>=0) x.p=pp;
  });
  saveOrders(orders); renderInvoice(id);
}

/* ---------- экспорт ---------- */
function invText(o){
  var t='Реализация товаров № '+o.id+' от '+o.date+' г.\nПоставщик: '+(o.supplier||'')+'\nПокупатель: '+(o.buyer||'')+'\n\n';
  o.items.forEach(function(x,i){ t+=(i+1)+'. '+x.n+' — '+x.q+' '+x.u+' × '+x.p+' = '+(x.q*x.p).toFixed(2)+'\n'; });
  t+='\nИтого: '+fmt(orderTotal(o))+'\nВсего наименований '+o.items.length+'\n'+rubWords(orderTotal(o))+'\nОтпустил: '+(o.released||'')+'   Получил: '+(o.received||'');
  return t;
}
function dl(name, content, mime){
  var b=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}
function invFile(o){ return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Накладная № '+o.id+'</title><style>body{font-family:Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:6px}</style></head><body>'+invoiceHtml(o,false)+'</body></html>'; }
function onecXml(o){
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07">\n <Документ>\n  <Номер>'+o.id+'</Номер>\n  <Дата>'+o.date.split('.').reverse().join('-')+'</Дата>\n  <Контрагент><Наименование>'+esc(o.buyer||'Покупатель')+'</Наименование></Контрагент>\n';
  o.items.forEach(function(it){ x+='  <Строка><Товар>'+esc(it.n)+'</Товар><Количество>'+it.q+'</Количество><Цена>'+it.p+'</Цена><Сумма>'+(it.q*it.p).toFixed(2)+'</Сумма><Единица>'+it.u+'</Единица></Строка>\n'; });
  x+=' </Документ>\n</КоммерческаяИнформация>';
  return x;
}

/* ---------- навигация и действия ---------- */
var ACT = {
  'nav': function(el){ state.view=el.dataset.view; shown=PORT; render(); },
  'cat': function(el){ state.cat=parseInt(el.dataset.c); shown=PORT; renderCatalog(); },
  'more': function(){ shown+=PORT; renderCatalog(); },
  'inc': function(el){ var i=el.dataset.i; state.cart[i]=(state.cart[i]||0)+1; saveCart(); rerenderKeepFocus(i); },
  'dec': function(el){ var i=el.dataset.i; state.cart[i]=Math.max(0,(state.cart[i]||0)-1); if(!state.cart[i]) delete state.cart[i]; saveCart(); rerenderKeepFocus(i); },
  'qty': function(el){ var i=el.dataset.i; var v=parseFloat(String(el.value).replace(',','.')); if(isNaN(v)||v<0) v=0; state.cart[i]=v; if(!v) delete state.cart[i]; saveCart(); updateBar(); },
  'add': function(el){ var i=el.dataset.i; if(!state.cart[i]) state.cart[i]=1; saveCart(); rerenderKeepFocus(i); updateBar(); },
  'go-cart': function(){ state.view='cart'; render(); },
  'checkout': function(){ createOrder(); },
  'open-settings': function(){ var s=loadSettings(); document.getElementById('set-supplier').value=s.supplier; document.getElementById('set-buyer').value=s.buyer; document.getElementById('set-released').value=s.released; document.getElementById('set-invnum').value=s.invnum; document.getElementById('modal').classList.add('open'); },
  'close-modal': function(){ document.getElementById('modal').classList.remove('open'); },
  'save-settings': function(){
    var s={ supplier: document.getElementById('set-supplier').value,
            buyer: document.getElementById('set-buyer').value,
            released: document.getElementById('set-released').value,
            invnum: parseInt(document.getElementById('set-invnum').value)||1 };
    saveSettings(s);
    document.getElementById('modal').classList.remove('open');
    if(state.view==='catalog') renderCatalog(); else render();
  },
  'back': function(){ state.openId=null; state.view='orders'; renderOrders(); },
  'open-inv': function(el){ state.openId=parseInt(el.dataset.id); renderInvoice(state.openId); },
  'edit-inv': function(el){ renderInvoiceEdit(parseInt(el.dataset.id)); },
  'save-inv': function(el){ collectEdit(parseInt(el.dataset.id)); },
  'print-inv': function(){ window.print(); },
  'dl-inv': function(el){ var o=loadOrders().find(function(x){return x.id===parseInt(el.dataset.id);}); if(o) dl('nakladnaya_'+o.id+'.html', invFile(o), 'text/html;charset=utf-8'); },
  'mail-inv': function(el){ var o=loadOrders().find(function(x){return x.id===parseInt(el.dataset.id);}); if(!o) return; window.location.href='mailto:?subject='+encodeURIComponent('Накладная № '+o.id)+'&body='+encodeURIComponent(invText(o)); },
  'share-inv': function(el){ var o=loadOrders().find(function(x){return x.id===parseInt(el.dataset.id);}); if(!o) return;
    var t=invText(o);
    if(navigator.share){ navigator.share({title:'Накладная № '+o.id, text:t}).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){ showNote('Текст накладной скопирован в буфер'); }); }
  },
  'onec-inv': function(el){ var o=loadOrders().find(function(x){return x.id===parseInt(el.dataset.id);}); if(o) dl('nakladnaya_'+o.id+'_1c.xml', onecXml(o), 'application/xml;charset=utf-8'); },
  'del-inv': function(el){ var id=parseInt(el.dataset.id); if(!confirm('Удалить накладную № '+id+'?')) return; saveOrders(loadOrders().filter(function(x){return x.id!==id;})); if(state.openId===id) state.openId=null; renderOrders(); },
  'sel': function(el){ var id=parseInt(el.dataset.id); if(el.checked) state.sel[id]=true; else delete state.sel[id]; },
  'sel-all': function(el){ state.sel={}; if(el.checked){ loadOrders().forEach(function(o){state.sel[o.id]=true;}); } document.querySelectorAll('[data-act="sel"]').forEach(function(c){c.checked=!!state.sel[parseInt(c.dataset.id)];}); },
  'del-sel': function(){ var n=Object.keys(state.sel).length; if(!n){ showErr('Ничего не выбрано — отметьте галочками'); return; } if(!confirm('Удалить выбранные заявки ('+n+')?')) return; saveOrders(loadOrders().filter(function(o){return !state.sel[o.id];})); state.sel={}; renderOrders(); }
};
function rerenderKeepFocus(i){
  if(state.view==='cart'){ renderCart(); return; }
  var old=document.getElementById('q'+i); var wasFocus=old&&document.activeElement===old; var pos=wasFocus?old.selectionStart:0;
  renderCatalog();
  if(wasFocus){ var e=document.getElementById('q'+i); if(e){ e.focus(); try{e.setSelectionRange(pos,pos);}catch(x){} } }
}
function render(){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.view===state.view); });
  if(state.view==='catalog'){ renderCatalog(); return; }
  if(state.view==='cart'){ renderCart(); return; }
  if(state.view==='orders'){ renderOrders(); return; }
  renderCatalog();
}
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act, fn=ACT[act];
  if(fn){ try{ fn(el); }catch(err){ showErr(act+': '+err.message); } }
  else { showErr('Нет обработчика: '+act); }
});
document.addEventListener('change', function(e){
  var el=e.target.closest('[data-act="qty"]'); if(!el) return;
  var fn=ACT['qty']; if(fn){ try{ fn(el); }catch(err){ showErr('qty: '+err.message); } }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('modal').classList.remove('open'); });
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });

loadCart();
render();
</script>
