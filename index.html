<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог — заявки и накладные</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fdb">
<style>
:root{--brand:#2f6fdb;--danger:#c0392b;--bg:#f2f4f8;--line:#e3e7ef;--text:#1c2430;--mut:#6b7787}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px}
.topnav{display:flex;gap:8px;flex:1;flex-wrap:wrap;align-items:center}
.navbtn{background:rgba(255,255,255,.16);border:0;color:#fff;padding:8px 14px;border-radius:10px;font-size:15px;cursor:pointer}
.navbtn.on{background:#fff;color:var(--brand);font-weight:600}
main{max-width:920px;margin:0 auto;padding:12px}
.sec-title{font-size:19px;margin:6px 0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.searchrow{margin:8px 0}
#searchBox{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.count{color:var(--mut);font-size:13px;margin:4px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.card-top{display:flex;gap:10px;align-items:flex-start}
.picon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;font-size:14px;line-height:1.25}
.pcat{color:var(--mut);font-size:12px;margin-top:2px}
.stock{font-size:12px;margin-top:3px}
.stock.ok{color:#1d7a3a;font-weight:600}
.stock.nodata{color:var(--mut)}
.stock.zero{color:var(--danger);font-weight:600}
.pprice{font-weight:700;white-space:nowrap}
.card-act{display:flex;gap:8px;align-items:center;margin-top:8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.qbtn{border:0;background:#eef2f9;width:34px;height:36px;font-size:18px;cursor:pointer}
.qin{width:58px;border:0;text-align:center;font-size:15px;height:36px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;background:#e8edf6;color:var(--text)}
.btn.primary{background:var(--brand);color:#fff}
.btn.add{background:var(--brand);color:#fff;flex:none}
.btn.danger{background:#fdecea;color:var(--danger)}
.btn.ghost{background:#eef2f9}
.btn.more{display:block;margin:12px auto;width:100%;max-width:420px}
.btn.big{width:100%;padding:13px;font-size:16px;margin:10px 0}
.btn.sm{padding:8px 10px}
.orders{display:flex;flex-direction:column;gap:8px}
.order-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center}
.chk input{width:20px;height:20px}
.oinfo{flex:1;min-width:180px}
.onum{font-weight:600;font-size:14px}
.omet{color:var(--mut);font-size:13px;margin-top:2px}
.oact{display:flex;gap:8px;align-items:center}
.ord-tools{display:flex;gap:8px}
.cart-total{font-size:17px;text-align:right;margin:12px 4px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut)}
.inv-doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;max-width:760px;margin:0 auto}
.inv-title{font-size:19px;margin:0 0 8px}
.inv-hr{border:0;border-top:2px solid #000;margin:10px 0}
.inv-line{margin:8px 0;font-size:15px;display:flex;align-items:center;gap:6px}
.inv-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
.inv-table th,.inv-table td{border:1px solid #333;padding:6px 8px;vertical-align:top}
.inv-table .r{text-align:right;white-space:nowrap}
.inv-total{text-align:right;font-size:15px;margin:4px 0}
.inv-note{margin:10px 0;font-size:14px}
.inv-sign{display:flex;justify-content:space-between;gap:20px;margin-top:26px;font-size:14px;flex-wrap:wrap}
.inv-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ie{border:1px solid var(--brand);border-radius:6px;padding:5px;font-size:13px;width:100%}
.ie.nm{min-width:220px}
.ie.nm2{width:80px;text-align:right}
.ie.un{width:56px;text-align:center}
.ie.half{max-width:320px}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{border:0;background:#eef2f9;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
.fld{display:block;font-size:13px;color:var(--mut);margin:10px 0}
.fld input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
#errbox{display:none;background:#fdecea;color:var(--danger);border:1px solid #f5c6c0;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px;word-break:break-word}
@media print{.topbar,.no-print,.searchrow,.chips,.count,.modal-bg,#toast,#errbox{display:none!important}body{background:#fff}.inv-doc{border:0;max-width:none;margin:0;padding:0}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">📦 Каталог</div><div class="topnav">
<button class="navbtn on" data-action="tab" data-tab="catalog">Каталог</button>

<button class="navbtn" data-action="tab" data-tab="orders">Заявки <span id="ordersBadge" style="display:none"></span></button>
<button class="navbtn" data-action="open-settings" title="Настройки">⚙️</button>
</div></header>
<main id="view"></main>
<div id="errbox"></div>
<div id="modal-root"></div>

h+='<div class="order-row"><label class="chk"><input type="checkbox" data-role="selord" data-id="'+o.id+'"'+(state.sel[o.id]?' checked':'')+'></label><div class="oinfo"><div class="onum">Реализация товаров № '+o.num+' от '+esc(o.date)+'</div><div class="omet">Покупатель: '+esc(o.buyer)+' · позиций: '+o.items.length+' · сумма: '+fmt(o.total)+' ₽</div></div><div class="oact"><button class="btn" data-action="open-order" data-id="'+o.id+'">Открыть накладную</button><button class="btn danger sm" data-action="del-order" data-id="'+o.id+'">🗑</button></div></div>';}
h+='</div>';el.innerHTML=h;updateDelBtn();}
function updateDelBtn(){var b=$('delSelBtn');if(!b)return;var n=0;for(var k in state.sel)if(state.sel[k])n++;b.textContent='🗑 Удалить выбранные ('+n+')';}
function delSelected(){var ids=[];for(var k in state.sel)if(state.sel[k])ids.push(k);if(!ids.length){toast('Сначала отметьте заявки галочками');return;}
if(!confirm('Удалить выбранные заявки ('+ids.length+')?'))return;
var orders=getOrders().filter(function(o){return ids.indexOf(String(o.id))<0;});
setOrders(orders);state.sel={};updateBadges();renderView();toast('Удалено: '+ids.length);}
function invTable(o,editing){var rows='';for(var i=0;i<o.items.length;i++){var it=o.items[i],s=it.qty*it.price;
if(editing){rows+='<tr><td>'+(i+1)+'</td><td><input class="ie nm" data-f="name" data-i="'+i+'" value="'+esc(it.name)+'"></td><td><input class="ie nm2" data-f="qty" data-i="'+i+'" value="'+it.qty+'"></td><td><input class="ie un" data-f="unit" data-i="'+i+'" value="'+esc(it.unit)+'"></td><td><input class="ie nm2 r" data-f="price" data-i="'+i+'" value="'+it.price+'"></td><td class="r">'+fmt(s)+'</td></tr>';}
else{rows+='<tr><td>'+(i+1)+'</td><td>'+esc(it.name)+'</td><td class="r">'+fmtInt(it.qty)+'</td><td>'+esc(it.unit)+'</td><td class="r">'+fmt(it.price)+'</td><td class="r">'+fmt(s)+'</td></tr>';}}
return rows;}
function invoiceHTML(o,editing){
var sup=editing?'<input class="ie half" id="inv-supplier" value="'+esc(o.supplier)+'">':'<b>'+esc(o.supplier)+'</b>';
var buy=editing?'<input class="ie half" id="inv-buyer" value="'+esc(o.buyer)+'">':'<b>'+esc(o.buyer)+'</b>';
var rel=editing?'<input class="ie half" id="inv-rel" value="'+esc(o.releasedBy)+'">':esc(o.releasedBy);
var rec=editing?'<input class="ie half" id="inv-rec" value="'+esc(o.receivedBy||'')+'">':esc(o.receivedBy||'');
var total=0;for(var i=0;i<o.items.length;i++)total+=o.items[i].qty*o.items[i].price;total=Math.round(total*100)/100;
return '<div class="inv-doc"><h2 class="inv-title">Реализация товаров № '+o.num+' от '+esc(o.date)+' г.</h2><hr class="inv-hr">'+
'<div class="inv-line">Поставщик: '+sup+'</div>'+
'<div class="inv-line">Покупатель: '+buy+'</div>'+
'<table class="inv-table"><thead><tr><th>№</th><th>Товар</th><th>Количество</th><th></th><th>Цена</th><th>Сумма</th></tr></thead><tbody>'+invTable(o,editing)+'</tbody></table>'+
'<div class="inv-total">Итого: <b>'+fmt(total)+'</b></div>'+
'<div class="inv-total">В том числе НДС: <b>'+fmt(o.vat||0)+'</b></div>'+
'<div class="inv-note">Всего наименований '+o.items.length+', на сумму '+fmt(total)+' руб.<br><b>'+sumWords(total)+'</b></div>'+
'<hr class="inv-hr"><div class="inv-sign"><div>Отпустил '+rel+'</div><div>Получил '+rec+'</div></div></div>';}
function renderInvoice(o){var el=$('view');
var btns='<div class="inv-actions no-print"><button class="btn" data-action="back">← Назад</button>';
if(state.edit){btns+='<button class="btn primary" data-action="save-edit">💾 Сохранить</button><button class="btn" data-action="cancel-edit">✖ Отмена</button>';}
else{btns+='<button class="btn" data-action="edit">✏️ Редактировать</button>';}
btns+='<button class="btn" data-action="print">🖨 Печать/PDF</button><button class="btn" data-action="download">⬇ Скачать</button><button class="btn" data-action="email">✉ Email</button><button class="btn" data-action="share">↗ Поделиться</button><button class="btn" data-action="export1c">📊 Экспорт для 1С</button><button class="btn danger" data-action="del-order" data-id="'+o.id+'">🗑 Удалить</button></div>';
el.innerHTML=btns+invoiceHTML(o,state.edit);}
function saveEdit(){var o=findOrder(state.curOrder);if(!o){showError('Накладная не найдена');return;}
var sup=$('inv-supplier'),buy=$('inv-buyer'),rel=$('inv-rel'),rec=$('inv-rec');
if(sup)o.supplier=sup.value.trim()||o.supplier;
if(buy)o.buyer=buy.value.trim()||o.buyer;
if(rel)o.releasedBy=rel.value.trim();
if(rec)o.receivedBy=rec.value.trim();
var total=0;
for(var i=0;i<o.items.length;i++){var it=o.items[i];
var nm=document.querySelector('[data-f="name"][data-i="'+i+'"]'),q=document.querySelector('[data-f="qty"][data-i="'+i+'"]'),un=document.querySelector('[data-f="unit"][data-i="'+i+'"]'),pr=document.querySelector('[data-f="price"][data-i="'+i+'"]');
if(nm&&nm.value.trim())it.name=nm.value.trim();
if(q)it.qty=parseFloat(pnum(q.value))||0;
if(un&&un.value.trim())it.unit=un.value.trim();
if(pr)it.price=parseFloat(pnum(pr.value))||0;
total+=it.qty*it.price;}
o.total=Math.round(total*100)/100;o.status='confirmed';
saveOrder(o);state.edit=false;renderInvoice(findOrder(o.id));toast('Изменения сохранены');}
function invText(o){var s='Реализация товаров № '+o.num+' от '+o.date+'\nПоставщик: '+o.supplier+'\nПокупатель: '+o.buyer+'\n';
for(var i=0;i<o.items.length;i++){var it=o.items[i];s+=(i+1)+'. '+it.name+' — '+fmtInt(it.qty)+' '+it.unit+' x '+fmt(it.price)+' = '+fmt(it.qty*it.price)+'\n';}
s+='Итого: '+fmt(o.total)+'\nВ том числе НДС: '+fmt(o.vat||0)+'\nВсего наименований '+o.items.length+', на сумму '+fmt(o.total)+' руб.\n'+sumWords(o.total)+'\nОтпустил: '+o.releasedBy+'\nПолучил: '+(o.receivedBy||'');
return s;}
function downloadFile(name,content,type){var blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},3000);}
function standaloneHTML(o){var doc=document.createElement('html');var inner=$('view').querySelector('.inv-doc');var clone=inner.cloneNode(true);clone.querySelectorAll('input').forEach(function(inp){var t=document.createTextNode(inp.value);inp.parentNode.replaceChild(t,inp);});
return '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Накладная № '+o.num+'</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 12px}h2{font-size:19px}hr{border:0;border-top:2px solid #000;margin:10px 0}.inv-line{margin:8px 0}.inv-table{width:100%;border-collapse:collapse;font-size:14px}.inv-table th,.inv-table td{border:1px solid #333;padding:6px 8px;vertical-align:top}.inv-table .r{text-align:right;white-space:nowrap}.inv-total{text-align:right;margin:6px 0}.inv-note{margin:10px 0}.inv-sign{display:flex;justify-content:space-between;margin-top:28px}b{font-weight:bold}</style></head><body>'+clone.outerHTML+'</body></html>';}
function export1c(o){var d=o.date.split('.');var iso=d[2]+'-'+d[1]+'-'+d[0];
var x='<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07" ДатаФормирования="'+iso+'">\n <Документ>\n  <Ид>'+o.id+'</Ид>\n  <Номер>'+o.num+'</Номер>\n  <Дата>'+iso+'</Дата>\n  <Операция>Реализация товаров</Операция>\n  <Контрагенты><Контрагент><Наименование>'+esc(o.buyer)+'</Наименование><Роль>Покупатель</Роль></Контрагент></Контрагенты>\n  <Товары>\n';
for(var i=0;i<o.items.length;i++){var it=o.items[i];x+='   <Товар><Наименование>'+esc(it.name)+'</Наименование><БазоваяЕдиница Код="796" Наименование="'+esc(it.unit)+'"/><Количество>'+it.qty+'</Количество><ЦенаЗаЕдиницу>'+it.price+'</ЦенаЗаЕдиницу><Сумма>'+Math.round(it.qty*it.price*100)/100+'</Сумма></Товар>\n';}
x+='  </Товары>\n  <Сумма>'+o.total+'</Сумма>\n </Документ>\n</КоммерческаяИнформация>';
downloadFile('nakladnaya_'+o.num+'_1C.xml',x,'application/xml');toast('XML для 1С скачан');}
function openSettings(){var st=getSettings();
$('modal-root').innerHTML='<div class="modal-bg" data-action="close-settings"><div class="modal" data-stop="1"><div class="modal-head"><h3>⚙️ Настройки</h3><button class="x" data-action="close-settings">✕</button></div><label class="fld">Поставщик<input id="set-supplier" value="'+esc(st.supplier)+'"></label><label class="fld">Покупатель<input id="set-buyer" value="'+esc(st.buyer)+'"></label><label class="fld">Отпустил (ФИО)<input id="set-released" value="'+esc(st.releasedBy)+'"></label><label class="fld">Стартовый номер накладной<input id="set-num" type="number" min="1" value="'+st.nextNum+'"></label><button class="btn primary big" data-action="save-settings">Сохранить</button></div></div>';}
function closeSettings(){$('modal-root').innerHTML='';}
function saveSettings(){var st={supplier:($('set-supplier').value.trim()||'поставщик'),buyer:($('set-buyer').value.trim()||'Натали'),releasedBy:($('set-released').value.trim()||'Межлумян Л.Г.'),nextNum:parseInt($('set-num').value,10)||1};
setSettings(st);closeSettings();renderView();toast('Настройки сохранены');}
function updateNav(){var btns=document.querySelectorAll('.navbtn[data-tab]');for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].getAttribute('data-tab')===state.tab);}
function renderView(){try{var el=$('view');el.innerHTML='';
if(state.tab==='catalog'){renderCatalog();}
else if(state.tab==='cart'){renderCart();}
else if(state.tab==='orders'){if(state.curOrder!=null){var o=findOrder(state.curOrder);if(o){renderInvoice(o);updateNav();return;}state.curOrder=null;}
renderOrders();}
updateNav();}catch(e){showError((e&&e.message?e.message:String(e))+' | '+(e&&e.stack?String(e.stack).split('\n')[1]:''));}}
document.addEventListener('click',function(e){
var el=e.target.closest?e.target.closest('[data-action]'):null;if(!el)return;
var a=el.getAttribute('data-action');
try{
if(a==='tab'){state.tab=el.getAttribute('data-tab')||'catalog';state.curOrder=null;state.edit=false;renderView();}
else if(a==='cat'){state.cat=parseInt(el.getAttribute('data-cat'),10);state.shown=40;renderCatalog();}
else if(a==='more'){state.shown+=40;renderCatalog();}
else if(a==='inc'||a==='dec'){var id=parseInt(el.getAttribute('data-id'),10);var inp=$('q'+id);var v=(parseFloat(pnum(inp.value))||0)+(a==='inc'?1:-1);if(v<0)v=0;inp.value=v;state.qty[id]=v;}
else if(a==='add'){cartAdd(parseInt(el.getAttribute('data-id'),10));}
else if(a==='cinc'||a==='cdec'){cartQty(parseInt(el.getAttribute('data-id'),10),a==='cinc'?1:-1);}
else if(a==='crem'){var cart=getCart(),cid=parseInt(el.getAttribute('data-id'),10);for(var i=0;i<cart.length;i++)if(cart[i].id===cid){cart.splice(i,1);break;}setCart(cart);renderCart();updateBadges();}
else if(a==='checkout'){checkout();}
else if(a==='sel-all'){var orders=getOrders();var all=true;for(var j=0;j<orders.length;j++)if(!state.sel[orders[j].id])all=false;
if(all){state.sel={};}else{for(var j2=0;j2<orders.length;j2++)state.sel[orders[j2].id]=true;}
renderOrders();}
else if(a==='del-sel'){delSelected();}
else if(a==='open-order'){state.curOrder=el.getAttribute('data-id');state.edit=false;renderView();}
else if(a==='del-order'){if(!confirm('Удалить эту заявку?'))return;var did=el.getAttribute('data-id');
setOrders(getOrders().filter(function(o){return String(o.id)!==String(did);}));
if(String(state.curOrder)===String(did))state.curOrder=null;
state.sel={};updateBadges();renderView();toast('Заявка удалена');}
else if(a==='back'){state.curOrder=null;state.edit=false;renderView();}
else if(a==='edit'){state.edit=true;renderInvoice(findOrder(state.curOrder));}
else if(a==='cancel-edit'){state.edit=false;renderInvoice(findOrder(state.curOrder));}
else if(a==='save-edit'){saveEdit();}
else if(a==='print'){window.print();}
else if(a==='download'){var o3=findOrder(state.curOrder);if(o3)downloadFile('nakladnaya_'+o3.num+'.html',standaloneHTML(o3),'text/html;charset=utf-8');}
else if(a==='email'){var o4=findOrder(state.curOrder);if(o4){var t=invText(o4);var max=1800;if(t.length>max)t=t.slice(0,max)+'\n… (полный текст в приложении)';window.location.href='mailto:?subject='+encodeURIComponent('Накладная № '+o4.num)+'&body='+encodeURIComponent(t);}}
else if(a==='share'){var o5=findOrder(state.curOrder);if(!o5)return;var txt=invText(o5);
if(navigator.share){navigator.share({title:'Накладная № '+o5.num,text:txt}).catch(function(){});}
else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Текст накладной скопирован');},function(){toast('Не удалось скопировать');});}
else{toast('Отправка недоступна в этом браузере');}}
else if(a==='export1c'){var o6=findOrder(state.curOrder);if(o6)export1c(o6);}
else if(a==='open-settings'){openSettings();}
else if(a==='save-settings'){saveSettings();}
else if(a==='close-settings'){if(e.target.classList.contains('modal-bg')||e.target.classList.contains('x'))closeSettings();}
}catch(err){showError((err&&err.message?err.message:String(err))+' | '+(err&&err.stack?String(err.stack).split('\n')[1]:''));}
});
document.addEventListener('change',function(e){
if(e.target.getAttribute&&e.target.getAttribute('data-role')==='selord'){var id=e.target.getAttribute('data-id');if(e.target.checked)state.sel[id]=true;else delete state.sel[id];updateDelBtn();}});
document.addEventListener('input',function(e){
if(e.target.id==='searchBox'){state.q=e.target.value;renderCatalog();var sb=$('searchBox');if(sb){sb.focus();var L=sb.value.length;try{sb.setSelectionRange(L,L);}catch(x2){}}}
else if(e.target.id&&e.target.id.indexOf('q')===0){state.qty[parseInt(e.target.id.slice(1),10)]=e.target.value;}
else if(e.target.id&&e.target.id.indexOf('cq')===0){var cid=parseInt(e.target.id.slice(2),10);var cart=getCart();var nv=parseFloat(pnum(e.target.value))||0;for(var i=0;i<cart.length;i++)if(cart[i].id===cid){cart[i].qty=nv;break;}setCart(cart);var tot=$('cartTotalV');if(tot)tot.textContent=fmt(cartTotal())+' ₽';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modal-root').innerHTML)closeSettings();});
renderView();updateBadges();
})();

</script>
</body>
</html>
