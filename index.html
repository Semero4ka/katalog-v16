<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<title>Каталог оптовых цен</title>
<style>
:root{--primary:#1a237e;--bg:#f4f6f9;--white:#fff;--text:#333;--border:#ddd;--danger:#d32f2f;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{background:var(--primary);color:#fff;padding:12px 16px}
h1{margin:0;font-size:20px}.subtitle{font-size:12px;opacity:.9;margin-top:4px}
.top-bar{display:flex;gap:10px;margin:10px}
.btn-nav{background:#fff;color:var(--primary);padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.08);flex:1;justify-content:center;border:none;cursor:pointer;font-size:15px}
.badge{background:#f0a500;color:#333;border-radius:12px;padding:1px 8px;font-size:13px;min-width:22px;text-align:center}
.controls{display:flex;gap:10px;margin:0 10px 10px;flex-wrap:wrap}
select,input[type=text],input[type=number]{padding:12px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:#fff}
#category-filter{flex:1;min-width:140px}#search-input{flex:2;min-width:160px}
.product-list{padding:0 10px}
.product-item{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:12px;align-items:center}
.prod-img{width:52px;height:52px;background:#eceff3;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14.5px;font-weight:700;line-height:1.3}
.prod-cat{font-size:12px;color:#777;margin-top:2px}
.prod-stock{font-size:12px;margin-top:2px;color:var(--ok)}
.prod-stock.none{color:#999}.prod-stock.zero{color:var(--danger);font-weight:700}
.prod-price{font-size:16px;font-weight:800;color:var(--primary);margin-top:3px}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.qty-controls{display:flex;align-items:center;gap:6px}
.qty-btn{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-weight:800;font-size:17px;cursor:pointer}
.qty-input{width:42px;height:32px;text-align:center;border:1.5px solid var(--primary);border-radius:9px;font-size:14px;font-weight:700}
.btn-add{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-more{display:block;margin:14px auto;padding:12px 28px;background:#fff;color:var(--primary);border:1.5px solid var(--primary);border-radius:12px;font-weight:700;cursor:pointer;font-size:15px}
.settings-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:var(--primary);color:#fff;border-radius:50%;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:1000}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:3000;display:none;justify-content:center;align-items:flex-start;overflow-y:auto;padding:20px 0}
.modal-overlay.active{display:flex}
.modal{background:#fff;padding:18px;border-radius:16px;width:min(720px,94vw);max-height:92vh;overflow-y:auto;position:relative}
.modal h3{margin:0 0 14px;color:var(--primary)}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#999}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;color:#555}
.form-group input,.form-group select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.btn-modal{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px}
.btn-sec{width:100%;padding:12px;background:#fff;color:var(--primary);border:1.5px solid var(--primary);border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;margin-top:8px}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.cart-line .nm{flex:1}.cart-line .rm{color:var(--danger);background:none;border:none;font-size:18px;cursor:pointer}
.cart-total{font-size:17px;font-weight:800;text-align:right;margin:12px 0}
.req-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.req-toolbar label{font-size:14px;display:flex;gap:6px;align-items:center}
.btn-del-sel{background:var(--danger);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
.req-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.req-item .nm{flex:1;font-size:14px}.req-item .nm b{font-size:15px}
.btn-open{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.inv{font-size:14px}
.inv h2{font-size:17px;border-bottom:2px solid #000;padding-bottom:6px}
.inv .hdr{margin:6px 0}
.inv table{width:100%;border-collapse:collapse;margin-top:8px}
.inv table th,.inv table td{border:1px solid #000;padding:5px 6px;font-size:13px}
.inv table th{font-weight:700}
.inv .num{width:26px;text-align:center}.inv .qty{width:64px;text-align:right}.inv .un{width:28px;text-align:center}.inv .pr{width:74px;text-align:right}.inv .sm{width:88px;text-align:right}
.inv .tots{margin-top:10px;text-align:right;font-size:14px}
.inv .tots .line{margin:2px 0}
.inv .words{margin-top:8px;font-weight:700}
.inv .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:14px}
.inv input{width:100%;padding:5px;border:1px solid #bbb;border-radius:6px;font-size:13px}
.inv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.inv-actions button{padding:10px 13px;border-radius:10px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-weight:700;cursor:pointer;font-size:13px}
.inv-actions button.primary{background:var(--primary);color:#fff}
.btn-back{margin-bottom:10px;padding:9px 16px;border-radius:10px;border:1.5px solid #999;background:#fff;color:#555;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5000}
.toast.show{opacity:1}
.status-msg{text-align:center;color:#777;padding:40px 20px;font-size:15px}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<header><h1>Каталог оптовых цен</h1><span class="subtitle">Цены оптовые, без НДС, с доставкой · остатки по складу</span></header>
<div class="top-bar">
<button class="btn-nav" onclick="openCart()">🛒 Корзина <span class="badge" id="cart-count">0</span></button>
<button class="btn-nav" onclick="openRequests()">📋 Заявки <span class="badge" id="requests-count">0</span></button>
</div>
<div class="controls">
<select id="category-filter" onchange="catSel=this.value;shown=PAGE;renderProducts()"><option value="">Все категории</option></select>
<input type="text" id="search-input" placeholder="🔍 Поиск товара" oninput="query=this.value.trim().toLowerCase();shown=PAGE;renderProducts()">
</div>
<div class="product-list" id="products-container"><p class="status-msg">Загрузка данных...</p></div>
<button class="settings-btn" onclick="openSettings()">⚙️</button>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="cart-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('cart-modal')">&times;</button>
<h3>🛒 Корзина</h3><div id="cart-body"></div>
<button class="btn-modal" onclick="createOrder()">Оформить заявку (накладную)</button>
</div></div>

<div class="modal-overlay" id="requests-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('requests-modal')">&times;</button>
<h3>📋 Заявки (накладные)</h3><div id="requests-body"></div>
</div></div>

<div class="modal-overlay" id="order-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('order-modal')">&times;</button>
<div id="order-body"></div>
</div></div>

<div class="modal-overlay" id="settings-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('settings-modal')">&times;</button>
<h3>Настройки накладных</h3>
<div class="form-group"><label>Поставщик</label><input type="text" id="set-supplier"></div>
<div class="form-group"><label>Покупатель</label><input type="text" id="set-buyer"></div>
<div class="form-group"><label>ФИО для строки «Отпустил»</label><input type="text" id="set-released"></div>
<div class="form-group"><label>Следующий номер накладной</label><input type="number" id="set-nextnum"></div>
<button class="btn-modal" onclick="saveSettings()">Сохранить</button>
</div></div>

const ICONS=[[/(БАКАЛЕЯ|КОНСЕРВ|ИКРА|ТУШЕН|ПАШТЕТ)/,'🥫'],[/КОНДИТЕР|КОНФЕТ|ПРЯНИК|ТОРТ|ВАФЛ/,'🍬'],[/ПЕЧЕНЬ/,'🍪'],[/ЧАЙ/,'🍵'],[/КОФЕ/,'☕'],[/МОЛОЧ|СГУЩ|СЫР|СЛИВ/,'🥛'],[/ПИВО/,'🍺'],[/ВОДА/,'💧'],[/СОКИ|НАПИТ/,'🧃'],[/ЧИПСЫ|СУХАРИ|ОРЕХ|СНЕК/,'🍟'],[/ШОКОЛАД/,'🍫'],[/ЗЕФИР|МАРМЕЛАД|ПАСТИЛА/,'🍡'],[/МОРОЖ/,'🍦'],[/КИНДЕР|ИГРУШ/,'🎁'],[/КОЛБАС|ВЕТЧИН|МЯСО/,'🌭'],[/РЫБА/,'🐟'],[/БАТОНЧИКИ/,'🍫'],[/ЖЕВАТ/,'🍬'],[/ЗАМОРОЗ|ПЕЛЬМЕН/,'❄️'],[/КРУП|БАК/,'🌾'],[/МАКАРОН/,'🍝'],[/ПРИПРАВ|СПЕЦИ|СОЛЬ/,'🧂'],[/ЭНЕРГ/,'⚡'],[/БЫТОВЫЕ|ПАКЕТ|ХОЗ/,'🧻'],[/ХЛЕБ|СУХАР|СНЕК/,'🥖'],[/НАША ФАСОВКА|ВЕС/,'⚖️'],[/ЯЙЦ/,'🥚'],[/МАЙОНЕЗ|СОУС|КЕТЧУП|ТОМАТ/,'🧴'],[/ПАСХА/,'🥚'],[/НОВЫЙ ГОД|НОВОГОД/,'🎄'],[/ХОТ ДОГ|ТОППИНГ|СИРОП/,'🥤']];
function iconFor(cat){for(const p of ICONS){if(p[0].test(cat))return p[1];}return '📦';}
function fmt(n){return n.toFixed(2).replace('.',',')+' ₽';}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function el(id){return document.getElementById(id);}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function openModal(id){el(id).classList.add('active');}
function closeModal(id){el(id).classList.remove('active');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.querySelectorAll('.modal-overlay.active').forEach(function(m){m.classList.remove('active');});}});

function saveCart(){localStorage.setItem('catalog_cart',JSON.stringify(cart));localStorage.setItem('katalog_cart',JSON.stringify(cart));}

function init(){
 const sel=el('category-filter');const cats=[...new Set(CATALOG.map(function(p){return p.cat;}))];
 cats.forEach(function(c){const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
 updateCounts();renderProducts();
}
function filtered(){let list=CATALOG;if(catSel)list=list.filter(function(p){return p.cat===catSel;});if(query)list=list.filter(function(p){return p.name.toLowerCase().indexOf(query)>=0;});return list;}
function renderProducts(){
 const list=filtered();const slice=list.slice(0,shown);let h='';
 slice.forEach(function(p){
  const q=cart[p.id]||0;
  let st;
  if(p.stock===null)st='<div class="prod-stock none">Остаток: нет данных</div>';

  else st='<div class="prod-stock">Остаток: '+p.stock.toFixed(p.stock%1?2:0).replace('.',',')+' '+p.unit+'</div>';

   +'<div class="prod-img">'+iconFor(p.cat)+'</div>'
   +'<div class="prod-info"><div class="prod-name">'+esc(p.name)+'</div>'

   +'<button class="qty-btn" onclick="changeQty(\''+p.id+'\',-1)">−</button>'
   +'<input type="number" class="qty-input" min="0" id="q_'+p.id+'" value="'+q+'" onchange="setQty(\''+p.id+'\',this.value)">'
   +'<button class="qty-btn" onclick="changeQty(\''+p.id+'\',1)">+</button></div>'
   +'<button class="btn-add" onclick="addToCart(\''+p.id+'\')">В корзину</button></div></div>';
 });
 if(list.length>shown)h+='<button class="btn-more" onclick="shown+='+PAGE+';renderProducts()">Показать ещё ('+(list.length-shown)+')</button>';
 if(!list.length)h='<p class="status-msg">Товары не найдены</p>';
 el('products-container').innerHTML=h;
}
function changeQty(id,d){const inp=el('q_'+id);let v=(parseInt(inp.value,10)||0)+d;if(v<0)v=0;inp.value=v;setQty(id,v);}
function setQty(id,val){const n=parseInt(val,10)||0;if(n<=0)delete cart[id];else cart[id]=n;saveCart();updateCounts();}
function addToCart(id){const inp=el('q_'+id);const q=parseInt(inp.value,10)||0;if(q<=0){toast('Укажите количество');return;}cart[id]=q;saveCart();updateCounts();toast('Добавлено: '+q+' шт');}
function updateCounts(){const c=Object.values(cart).reduce(function(s,q){return s+q;},0);el('cart-count').textContent=c;el('requests-count').textContent=orders.length;}

function openCart(){
 const ids=Object.keys(cart);
 if(!ids.length){el('cart-body').innerHTML='<p class="status-msg">Корзина пуста. Укажите количество у товаров и нажмите «В корзину».</p>';openModal('cart-modal');return;}
 let h='';let total=0;
 ids.forEach(function(id){const p=CATALOG.find(function(x){return x.id===id;});if(!p)return;const s=p.price*cart[id];total+=s;
  h+='<div class="cart-line"><div class="nm">'+esc(p.name)+'</div><div>'+cart[id]+' × '+fmt(p.price)+'</div><button class="rm" onclick="removeFromCart(\''+id+'\')">×</button></div>';});
 h+='<div class="cart-total">Итого: '+fmt(total)+'</div>';
 el('cart-body').innerHTML=h;openModal('cart-modal');
}
function removeFromCart(id){delete cart[id];saveCart();updateCounts();openCart();}

function nextInvoiceNum(){
 const n=parseInt(settings.nextInvoice,10);
 if(n&&!isNaN(n))return n;
 let mx=0;orders.forEach(function(o){const m=parseInt(String(o.num).replace(/\D/g,''),10);if(m&&m>mx)mx=m;});
 return mx?mx+1:35157;
}
function createOrder(){
 const ids=Object.keys(cart);
 if(!ids.length){toast('Корзина пуста');return;}
 const items=[];let total=0;
 ids.forEach(function(id){const p=CATALOG.find(function(x){return x.id===id;});if(!p)return;const q=cart[id];const s=p.price*q;total+=s;
  items.push({name:p.name,qty:q,unit:p.unit==='кг'?'кг':'шт',price:p.price});});
 const num=nextInvoiceNum();
 const order={id:'o'+Date.now(),num:num,date:new Date().toLocaleDateString('ru-RU'),
  supplier:settings.supplier||'Поставщик',buyer:settings.buyer||'Покупатель',
  releasedBy:settings.releasedBy||'',receivedBy:'',
  status:'confirmed',items:items,total:total,vat:0};
 orders.unshift(order);
 settings.nextInvoice=num+1;saveSettingsLS();
 cart={};saveCart();updateCounts();closeModal('cart-modal');
 toast('Заявка № '+num+' оформлена');
 openOrder(order.id);
}

function openRequests(){selected.clear();renderRequests();openModal('requests-modal');}
function renderRequests(){
 const body=el('requests-body');
 if(!orders.length){body.innerHTML='<p class="status-msg">Заявок пока нет. Оформите заявку из корзины.</p>';return;}
 let h='<div class="req-toolbar"><label><input type="checkbox" id="sel-all" onchange="toggleAll(this.checked)"> Выбрать все</label>'
  +'<button class="btn-del-sel" onclick="deleteSelected()">🗑 Удалить выбранные (<span id="selcount">0</span>)</button></div>';
 orders.forEach(function(o){
  h+='<div class="req-item"><input type="checkbox" '+(selected.has(o.id)?'checked':'')+' onchange="toggleSel(\''+o.id+'\',this.checked)">'
   +'<div class="nm"><b>№ '+esc(o.num)+'</b> от '+esc(o.date)+'<br>'+o.items.length+' поз. — '+fmt(o.total)+'</div>'
   +'<button class="btn-open" onclick="openOrder(\''+o.id+'\')">Открыть</button></div>';
 });
 body.innerHTML=h;
}
function toggleSel(id,chk){if(chk)selected.add(id);else selected.delete(id);const sc=el('selcount');if(sc)sc.textContent=selected.size;}
function toggleAll(chk){selected.clear();if(chk)orders.forEach(function(o){selected.add(o.id);});renderRequests();}
function deleteSelected(){
 if(!selected.size){toast('Не выбрано ни одной заявки');return;}
 if(!confirm('Удалить выбранные заявки ('+selected.size+')?'))return;
 orders=orders.filter(function(o){return !selected.has(o.id);});
 selected.clear();saveOrders();updateCounts();renderRequests();toast('Удалено');
}

function rubWords(n){
 const onesM=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
 const onesF=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'];
 const teens=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
 const tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
 const hund=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
 function form(n,one,few,many){const l=n%100;if(l>=11&&l<=14)return many;const d=n%10;if(d===1)return one;if(d>=2&&d<=4)return few;return many;}
 function trip(x,gender){
  let out=[];const h=Math.floor(x/100),t=Math.floor((x%100)/10),o=x%10;
  if(h)out.push(hund[h]);
  if(t===1)out.push(teens[o]);else{if(t)out.push(tens[t]);if(o)out.push(gender==='f'?onesF[o]:onesM[o]);}
  return {w:out.join(' '),n:(t===1?o+10:o)};
 }
 const rub=Math.floor(n+0.001),kop=Math.round((n-Math.floor(n+0.001))*100+0.001);
 const m=Math.floor(rub/1000000),th=Math.floor(rub%1000000/1000),u=rub%1000;
 let parts=[];
 if(m){const t=trip(m,'m');parts.push(t.w+' '+form(m,'миллион','миллиона','миллионов'));}
 if(th){const t=trip(th,'f');parts.push(t.w+' '+form(th,'тысяча','тысячи','тысяч'));}
 if(u){const t=trip(u,'m');parts.push(t.w);}
 if(!parts.length)parts.push('ноль');
 let s=parts.join(' ')+' '+form(rub,'рубль','рубля','рублей');
 s=s.charAt(0).toUpperCase()+s.slice(1);
 s+=' '+(kop<10?'0':'')+kop+' '+form(kop,'копейка','копейки','копеек');
 return s;
}

function invoiceHTML(o,editable){
 let rows='';
 o.items.forEach(function(it,i){
  const s=it.qty*it.price;
  if(editable){
   rows+='<tr><td class="num">'+(i+1)+'</td>'
    +'<td><input value="'+esc(it.name)+'" onchange="editItem('+i+',\'name\',this.value)"></td>'
    +'<td class="qty"><input value="'+it.qty+'" onchange="editItem('+i+',\'qty\',this.value)"></td>'
    +'<td class="un"><select onchange="editItem('+i+',\'unit\',this.value)"><option '+(it.unit==='шт'?'selected':'')+'>'+ 'шт'+'</option><option '+(it.unit==='кг'?'selected':'')+'>'+ 'кг'+'</option></select></td>'
    +'<td class="pr"><input value="'+it.price+'" onchange="editItem('+i+',\'price\',this.value)"></td>'
    +'<td class="sm">'+fmt(s)+'</td></tr>';
  }else{
   rows+='<tr><td class="num">'+(i+1)+'</td><td>'+esc(it.name)+'</td>'
    +'<td class="qty">'+String(it.qty).replace('.',',')+'</td><td class="un">'+esc(it.unit)+'</td>'
    +'<td class="pr">'+it.price.toFixed(2).replace('.',',')+'</td><td class="sm">'+fmt(s)+'</td></tr>';
  }
 });
 const sup=editable?'<input value="'+esc(o.supplier)+'" onchange="editField(\'supplier\',this.value)">':esc(o.supplier);
 const buy=editable?'<input value="'+esc(o.buyer)+'" onchange="editField(\'buyer\',this.value)">':esc(o.buyer);
 const rel=editable?'<input value="'+esc(o.releasedBy)+'" onchange="editField(\'releasedBy\',this.value)">':esc(o.releasedBy);
 const rec=editable?'<input value="'+esc(o.receivedBy)+'" onchange="editField(\'receivedBy\',this.value)">':esc(o.receivedBy);
 return '<div class="inv print-area"><h2>Реализация товаров № '+esc(o.num)+' от '+esc(o.date)+' г.</h2>'
  +'<div class="hdr">Поставщик: <b>'+sup+'</b></div>'
  +'<div class="hdr">Покупатель: <b>'+buy+'</b></div>'
  +'<table><tr><th class="num">№</th><th>Товар</th><th class="qty">Кол-во</th><th class="un">Ед.</th><th class="pr">Цена</th><th class="sm">Сумма</th></tr>'+rows+'</table>'
  +'<div class="tots"><div class="line"><b>Итого: '+fmt(o.total)+'</b></div><div class="line">В том числе НДС: '+o.vat+'</div></div>'
  +'<div class="words">Всего наименований '+o.items.length+', на сумму '+fmt(o.total)+'<br>'+rubWords(o.total)+'</div>'
  +'<div class="sign"><span>Отпустил ___________ '+rel+'</span><span>Получил ___________ '+rec+'</span></div></div>';
}

function openOrder(id){
 curOrder=orders.find(function(o){return o.id===id;});
 if(!curOrder){toast('Заявка не найдена');return;}
 editing=false;renderOrder();
 closeModal('requests-modal');openModal('order-modal');
}
function renderOrder(){
 let h='<button class="btn-back" onclick="closeModal(\'order-modal\');openRequests()">← К списку заявок</button>';
 h+='<div class="inv-actions">'
  +'<button class="primary" onclick="toggleEdit()">'+(editing?'💾 Сохранить':'✏️ Редактировать')+'</button>'
  +'<button onclick="printInvoice()">🖨 Печать / PDF</button>'
  +'<button onclick="downloadInvoice()">⬇ Скачать</button>'
  +'<button onclick="emailInvoice()">✉ Email</button>'
  +'<button onclick="shareInvoice()">↗ Поделиться</button>'
  +'<button onclick="export1C()">📊 Экспорт для 1С</button></div>';
 h+=invoiceHTML(curOrder,editing);
 el('order-body').innerHTML=h;
}
function toggleEdit(){
 if(editing){saveOrders();toast('Изменения сохранены');}
 editing=!editing;renderOrder();
}
function editField(f,v){curOrder[f]=v;}
function editItem(i,f,v){
 const it=curOrder.items[i];
 if(f==='qty')it.qty=parseFloat(String(v).replace(',','.'))||0;
 else if(f==='price')it.price=parseFloat(String(v).replace(',','.'))||0;
 else it[f]=v;
 let total=0;curOrder.items.forEach(function(x){total+=x.qty*x.price;});
 curOrder.total=total;saveOrders();
 const tr=event.target.closest('tr');
 if(tr&&f!=='name'&&f!=='unit'){tr.querySelector('.sm').textContent=fmt(it.qty*it.price);}
 const tot=el('order-body');if(tot){/* итог пересчитается при перерендере */}
}
function printInvoice(){
 const w=window.open('','_blank');
 w.document.write('<html><head><meta charset="utf-8"><title>Накладная № '+esc(curOrder.num)+'</title>'
  +'<style>body{font-family:Arial,sans-serif;font-size:14px;margin:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:5px 6px;font-size:13px}.num{width:26px;text-align:center}.qty{width:64px;text-align:right}.un{width:28px;text-align:center}.pr{width:74px;text-align:right}.sm{width:88px;text-align:right}.tots{text-align:right;margin-top:10px}.words{font-weight:700;margin-top:8px}.sign{display:flex;justify-content:space-between;margin-top:26px}input{border:none;font:inherit}</style>'
  +'</head><body>'+invoiceHTML(curOrder,false)+'</body></html>');
 w.document.close();w.focus();w.print();
}
function downloadInvoice(){
 const html='<html><head><meta charset="utf-8"><title>Накладная № '+esc(curOrder.num)+'</title><style>body{font-family:Arial,sans-serif;font-size:14px;margin:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:5px 6px;font-size:13px}.tots{text-align:right}.words{font-weight:700}.sign{display:flex;justify-content:space-between;margin-top:26px}</style></head><body>'+invoiceHTML(curOrder,false)+'</body></html>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
 a.download='nakladnaya_'+curOrder.num+'.html';a.click();toast('Файл скачан');
}
function invoiceText(o){
 let t='Реализация товаров № '+o.num+' от '+o.date+'\n';
 t+='Поставщик: '+o.supplier+'\nПокупатель: '+o.buyer+'\n\n';
 o.items.forEach(function(it,i){t+=(i+1)+'. '+it.name+' — '+it.qty+' '+it.unit+' × '+it.price.toFixed(2).replace('.',',')+' = '+(it.qty*it.price).toFixed(2).replace('.',',')+'\n';});
 t+='\nИтого: '+o.total.toFixed(2).replace('.',',')+' руб.\n'+rubWords(o.total);
 return t;
}
function emailInvoice(){
 const sub='Накладная № '+curOrder.num+' от '+curOrder.date;
 location.href='mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(invoiceText(curOrder));
}
function shareInvoice(){
 const t=invoiceText(curOrder);
 if(navigator.share){navigator.share({title:'Накладная № '+curOrder.num,text:t}).catch(function(){});}
 else{navigator.clipboard.writeText(t).then(function(){toast('Текст накладной скопирован');},function(){toast('Не удалось скопировать');});}
}
function export1C(){
 let xml='<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07" ДатаФормирования="'+curOrder.date+'">\n <Документ>\n';
 xml+='  <Ид>'+curOrder.id+'</Ид>\n  <Номер>'+curOrder.num+'</Номер>\n  <Дата>'+curOrder.date+'</Дата>\n  <ХозОперация>Реализация товаров</ХозОперация>\n';
 xml+='  <Контрагенты><Контрагент><Наименование>'+curOrder.buyer+'</Наименование><Роль>Покупатель</Роль></Контрагент></Контрагенты>\n';
 xml+='  <Товары>\n';
 curOrder.items.forEach(function(it){xml+='   <Товар><Наименование>'+esc(it.name)+'</Наименование><Количество>'+it.qty+'</Количество><Единица>'+it.unit+'</Единица><ЦенаЗаЕдиницу>'+it.price.toFixed(2)+'</ЦенаЗаЕдиницу><Сумма>'+(it.qty*it.price).toFixed(2)+'</Сумма></Товар>\n';});
 xml+='  </Товары>\n  <СуммаДокумента>'+curOrder.total.toFixed(2)+'</СуммаДокумента>\n </Документ>\n</КоммерческаяИнформация>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+xml],{type:'text/xml'}));
 a.download='nakladnaya_'+curOrder.num+'_1C.xml';a.click();toast('Файл для 1С скачан');
}

function openSettings(){
 el('set-supplier').value=settings.supplier||'';
 el('set-buyer').value=settings.buyer||'';
 el('set-released').value=settings.releasedBy||'';
 el('set-nextnum').value=settings.nextInvoice||'';
 openModal('settings-modal');
}
function saveSettings(){
 settings.supplier=el('set-supplier').value;
 settings.buyer=el('set-buyer').value;
 settings.releasedBy=el('set-released').value;
 settings.nextInvoice=el('set-nextnum').value;
 saveSettingsLS();closeModal('settings-modal');toast('Настройки сохранены');
}
