<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<title>Каталог оптовых цен</title>
<style>
:root{--primary:#1a237e;--primary-light:#314796;--bg:#f4f6f9;--white:#fff;--text:#333;--border:#ddd;--danger:#d32f2f;--success:#388e3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{background:var(--primary);color:#fff;padding:12px 16px}
h1{margin:0;font-size:20px}
.subtitle{font-size:12px;opacity:.9;margin-top:3px}
.top-bar{display:flex;gap:10px;margin:10px}
.btn-nav{background:#fff;color:var(--primary);padding:12px 14px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.08);flex:1;justify-content:center;border:none;cursor:pointer;font-size:15px}
.btn-nav.back{flex:0 0 auto}
.badge{background:#f0a500;color:#333;border-radius:12px;padding:1px 8px;font-size:13px;min-width:22px;text-align:center}
.view{display:none;padding:0 10px}
.view.active{display:block}
.controls{display:flex;gap:10px;margin:0 0 10px;flex-wrap:wrap}
select,input[type=text],input[type=number]{padding:11px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:#fff}
#search-input{flex:1;min-width:140px}
#category-filter{flex:1;min-width:140px}
.product-item{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:10px;align-items:center}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;font-weight:700;line-height:1.3;word-break:break-word}
.prod-cat{font-size:11px;color:#777;margin-top:2px}
.prod-price{font-size:16px;font-weight:800;color:var(--primary);margin-top:3px}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.qty-controls{display:flex;align-items:center;gap:5px}
.qty-btn{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-weight:800;font-size:17px;cursor:pointer;line-height:1}
.qty-input{width:44px;height:32px;text-align:center;border:1.5px solid var(--primary);border-radius:10px;font-size:14px;font-weight:700}
.btn-add{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;color:#fff;background:var(--primary)}
.btn.green{background:var(--success)}
.btn.red{background:var(--danger)}
.btn.gray{background:#607d8b}
.status-msg{text-align:center;color:#777;padding:40px 16px;font-size:15px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-title{font-weight:700;font-size:15px;margin-bottom:4px}
.card-sub{font-size:13px;color:#666}
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.settings-btn{position:fixed;bottom:20px;right:20px;width:54px;height:54px;background:var(--primary);color:#fff;border-radius:50%;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:900}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2000;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:none;justify-content:center;align-items:flex-end}
.modal-overlay.active{display:flex}
.modal{background:#fff;padding:20px;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;position:relative}
.modal h3{margin:0 0 16px;color:var(--primary)}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#999}
.form-group{margin-bottom:13px}
.form-group label{display:block;margin-bottom:5px;font-size:13px;color:#555}
.form-group input{width:100%;font-size:15px}
.cart-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
.cart-row .prod-name{flex:1;font-size:13px}
.inv-head{font-weight:800;font-size:17px;margin:6px 0 12px}
.inv-meta{margin-bottom:10px;font-size:14px}
table.inv{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.inv th,table.inv td{border:1px solid #333;padding:5px 6px;vertical-align:top}
table.inv th{font-size:12px}
td.num{text-align:right;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}
.inv-total{text-align:right;font-weight:800;font-size:15px;margin-top:10px}
.inv-vat{text-align:right;font-size:14px;margin-top:2px}
.inv-sumline{font-size:13px;margin-top:10px}
.inv-words{font-weight:700;font-size:14px;margin-top:4px}
.inv-sign{display:flex;gap:20px;margin-top:26px;font-size:14px;flex-wrap:wrap}
.inv-sign span{border-bottom:1px solid #333;padding:0 30px 2px 4px}
input.inv-inp{width:100%;border:1px solid #bbb;border-radius:6px;padding:4px;font-size:13px}
input.inv-inp-num{text-align:right;width:70px}
.unit-sel{border:1px solid #bbb;border-radius:6px;padding:3px;font-size:12px}
@media print{
  body *{visibility:hidden}
  #view-invoice,#view-invoice *{visibility:visible}
  #view-invoice{position:absolute;left:0;top:0;width:100%;padding:0}
  .no-print{display:none!important}
}
</style>
</head>
<body>
<header>
  <h1>Каталог оптовых цен</h1>
  <span class="subtitle">Цены оптовые, без НДС, с доставкой</span>
</header>

<div class="top-bar no-print">
  <button class="btn-nav back" id="btn-back" style="display:none" onclick="showView('catalog')">←</button>
  <button class="btn-nav" onclick="openCartView()">🛒 Корзина <span class="badge" id="cart-count">0</span></button>
  <button class="btn-nav" onclick="openRequestsView()">📋 Заявки <span class="badge" id="requests-count">0</span></button>
</div>

<div class="view active" id="view-catalog">
  <div class="controls">
    <select id="category-filter" onchange="applyFilters()"><option value="">Все категории</option></select>
    <input type="text" id="search-input" placeholder="🔍 Поиск товара" oninput="applyFilters()">
  </div>
  <div id="products-container"></div>
  <div class="btn-row" id="more-row" style="display:none"><button class="btn" style="width:100%" id="more-btn" onclick="showMore()">Показать ещё</button></div>
</div>

<div class="view" id="view-cart">
  <h3 style="margin:6px 0 10px">Корзина</h3>
  <div id="cart-container"></div>
</div>

<div class="view" id="view-requests">
  <h3 style="margin:6px 0 10px">Заявки и накладные</h3>
  <div id="requests-container"></div>
</div>

<div class="view" id="view-invoice">
  <div class="btn-row no-print" id="invoice-actions">
    <button class="btn" onclick="printInvoice()">🖨 Печать/PDF</button>
    <button class="btn gray" onclick="downloadInvoice()">⬇ Скачать</button>
    <button class="btn gray" onclick="emailInvoice()">✉ Email</button>
    <button class="btn gray" onclick="shareInvoice()">↗ Поделиться</button>
    <button class="btn gray" onclick="export1C()">📊 1С</button>
    <button class="btn green" id="btn-edit" onclick="startEdit()">✏️ Редактировать</button>
  </div>
  <div id="invoice-body"></div>
</div>

<button class="settings-btn no-print" onclick="openSettings()">⚙️</button>
<div class="toast" id="toast">Сохранено</div>

<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeSettings()">&times;</button>
    <h3>Настройки накладных</h3>
    <div class="form-group"><label>Поставщик</label><input type="text" id="set-supplier"></div>
    <div class="form-group"><label>Покупатель</label><input type="text" id="set-buyer"></div>
    <div class="form-group"><label>Отпустил (ФИО)</label><input type="text" id="set-released"></div>
    <div class="form-group"><label>Следующий номер накладной</label><input type="number" id="set-number"></div>
    <button class="btn" style="width:100%" onclick="saveSettings()">Сохранить</button>
  </div>
</div>

var allProducts = [], byId = {}, categories = [];
var cart, requests, settings, invoiceNum;
var currentView = 'catalog', currentOrderId = null, editing = false;
var PAGE = 40, shown = PAGE, currentList = null;

function lsGet(k){
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
}

function init(){
  CATALOG.groups.forEach(function(g){
    categories.push(g.name);
    g.items.forEach(function(it){
      var p = { id: it.id, name: it.name, price: it.price, category: g.name };
      allProducts.push(p); byId[p.id] = p;
    });
  });
  var sel = document.getElementById('category-filter');
  categories.forEach(function(c){
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  cart = lsGet('catalog_cart') || lsGet('katalog_cart') || {};
  requests = lsGet('catalog_requests') || lsGet('katalog_requests') || [];
  settings = lsGet('catalog_order_settings') || lsGet('katalog_order_settings') || {};
  invoiceNum = settings.nextNum || parseInt(localStorage.getItem('catalog_invoice_num') || localStorage.getItem('katalog_invoice_num') || '35157', 10) || 35157;
  renderProducts(); updateCartBadge(); updateRequestsBadge();
  window.onerror = function(msg){ toast('Ошибка: ' + msg); };
}

function renderProducts(){
  var cont = document.getElementById('products-container');
  var cat = document.getElementById('category-filter').value;
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  currentList = allProducts;
  if (cat) currentList = currentList.filter(function(p){ return p.category === cat; });
  if (q) currentList = currentList.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1 || p.category.toLowerCase().indexOf(q) !== -1; });
  cont.innerHTML = '';
  var n = Math.min(shown, currentList.length);
  for (var i = 0; i < n; i++) cont.appendChild(productCard(currentList[i]));
  var more = document.getElementById('more-row');
  if (currentList.length > shown) { more.style.display = 'flex'; document.getElementById('more-btn').textContent = 'Показать ещё (' + (currentList.length - shown) + ')'; }
  else more.style.display = 'none';
  if (currentList.length === 0) cont.innerHTML = '<p class="status-msg">Товары не найдены</p>';
}
function productCard(p){
  var qty = cart[p.id] ? cart[p.id].qty : 0;
  var card = document.createElement('div'); card.className = 'product-item';
  var info = document.createElement('div'); info.className = 'prod-info';
  var nm = document.createElement('div'); nm.className = 'prod-name'; nm.textContent = p.name;
  var ct = document.createElement('div'); ct.className = 'prod-cat'; ct.textContent = p.category;
  var pr = document.createElement('div'); pr.className = 'prod-price'; pr.textContent = fmtMoney(p.price);
  info.appendChild(nm); info.appendChild(ct); info.appendChild(pr);
  var right = document.createElement('div'); right.className = 'right-col';
  var qc = document.createElement('div'); qc.className = 'qty-controls';
  var minus = document.createElement('button'); minus.className = 'qty-btn'; minus.textContent = '−';
  minus.onclick = function(){ changeQty(p.id, -1); };
  var inp = document.createElement('input'); inp.type = 'number'; inp.className = 'qty-input'; inp.min = '0'; inp.value = qty;
  inp.onchange = function(){ setQty(p.id, inp.value); };
  var plus = document.createElement('button'); plus.className = 'qty-btn'; plus.textContent = '+';
  plus.onclick = function(){ changeQty(p.id, 1); };
  qc.appendChild(minus); qc.appendChild(inp); qc.appendChild(plus);
  var add = document.createElement('button'); add.className = 'btn-add'; add.textContent = 'В корзину';
  add.onclick = function(){ addToCart(p.id, inp.value); };
  right.appendChild(qc); right.appendChild(add);
  card.appendChild(info); card.appendChild(right);
  return card;
}
function showMore(){ shown += PAGE; renderProducts(); }
function applyFilters(){ shown = PAGE; renderProducts(); }

function changeQty(id, delta){
  var cur = cart[id] ? cart[id].qty : 0;
  var n = Math.max(0, cur + delta);
  if (n === 0) delete cart[id]; else cart[id] = { qty: n, unit: unitFor(byId[id].name) };
  saveCart(); renderProducts(); if (currentView === 'cart') renderCart();
}
function setQty(id, val){
  var n = parseInt(val, 10) || 0;
  if (n <= 0) delete cart[id]; else cart[id] = { qty: n, unit: unitFor(byId[id].name) };
  saveCart(); renderProducts(); if (currentView === 'cart') renderCart();
}
function addToCart(id, val){
  var n = parseInt(val, 10) || 0;
  if (n <= 0) { toast('Укажите количество'); return; }
  cart[id] = { qty: n, unit: unitFor(byId[id].name) };
  saveCart(); toast('Добавлено: ' + n + ' ' + cart[id].unit);
  if (currentView === 'cart') renderCart();
}
function unitFor(name){ return /кг|ВЕС/i.test(name) ? 'кг' : 'шт'; }
function saveCart(){ lsSet('catalog_cart', cart); lsSet('katalog_cart', cart); updateCartBadge(); }
function cartTotalQty(){ var t = 0; for (var k in cart) t += cart[k].qty; return t; }
function updateCartBadge(){ document.getElementById('cart-count').textContent = cartTotalQty(); }
function updateRequestsBadge(){ document.getElementById('requests-count').textContent = requests.length; }

function showView(name){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('btn-back').style.display = (name === 'catalog') ? 'none' : 'flex';
  currentView = name;
  if (name === 'cart') renderCart();
  if (name === 'requests') renderRequests();
  window.scrollTo(0, 0);
}
function openCartView(){ showView('cart'); }
function openRequestsView(){ showView('requests'); }

function renderCart(){
  var cont = document.getElementById('cart-container');
  cont.innerHTML = '';
  var ids = Object.keys(cart);
  if (ids.length === 0) { cont.innerHTML = '<p class="status-msg">Корзина пуста.<br>Укажите количество у товаров и нажмите «В корзину».</p>'; return; }
  var total = 0;
  ids.forEach(function(id){
    var p = byId[id]; if (!p) return;
    var e = cart[id]; var sum = e.qty * p.price; total += sum;
    var row = document.createElement('div'); row.className = 'cart-row';
    var nm = document.createElement('div'); nm.className = 'prod-name'; nm.textContent = p.name;
    var qc = document.createElement('div'); qc.className = 'qty-controls';
    var minus = document.createElement('button'); minus.className = 'qty-btn'; minus.textContent = '−'; minus.onclick = function(){ changeQty(id, -1); };
    var inp = document.createElement('input'); inp.type = 'number'; inp.className = 'qty-input'; inp.value = e.qty;
    inp.onchange = function(){ setQty(id, inp.value); };
    var plus = document.createElement('button'); plus.className = 'qty-btn'; plus.textContent = '+'; plus.onclick = function(){ changeQty(id, 1); };
    qc.appendChild(minus); qc.appendChild(inp); qc.appendChild(plus);
    var sm = document.createElement('div'); sm.style.cssText = 'font-weight:700;white-space:nowrap;font-size:14px'; sm.textContent = fmtMoney(sum);
    var del = document.createElement('button'); del.className = 'qty-btn'; del.style.borderColor = '#d32f2f'; del.style.color = '#d32f2f'; del.textContent = '✕';
    del.onclick = function(){ delete cart[id]; saveCart(); renderCart(); };
    row.appendChild(nm); row.appendChild(qc); row.appendChild(sm); row.appendChild(del);
    cont.appendChild(row);
  });
  var totalEl = document.createElement('div'); totalEl.className = 'inv-total'; totalEl.textContent = 'Итого: ' + fmtMoney(total);
  cont.appendChild(totalEl);
  var btn = document.createElement('button'); btn.className = 'btn green'; btn.style.cssText = 'width:100%;margin-top:10px;padding:14px';
  btn.textContent = '✅ Оформить заявку (накладную)';
  btn.onclick = createOrder;
  cont.appendChild(btn);
}

function createOrder(){
  var ids = Object.keys(cart);
  if (ids.length === 0) { toast('Корзина пуста'); return; }
  var items = [];
  ids.forEach(function(id){
    var p = byId[id]; if (!p) return;
    var e = cart[id];
    items.push({ name: p.name, qty: Number(e.qty), unit: e.unit || unitFor(p.name), price: p.price });
  });
  var num = invoiceNum;
  invoiceNum = num + 1;
  localStorage.setItem('catalog_invoice_num', String(invoiceNum));
  var o = {
    id: 'ord_' + Date.now(),
    number: num,
    date: fmtDate(new Date()),
    supplier: settings.supplier || 'поставщик',
    buyer: settings.buyer || '',
    releasedBy: settings.releasedBy || '',
    receivedBy: '',
    status: 'new',
    items: items
  };
  o.total = items.reduce(function(s, it){ return s + it.qty * it.price; }, 0);
  requests.unshift(o);
  saveRequests();
  cart = {}; saveCart();
  updateCartBadge(); updateRequestsBadge();
  toast('Заявка № ' + num + ' создана');
  openInvoice(o.id);
}

function saveRequests(){
  lsSet('catalog_requests', requests);
  lsSet('katalog_requests', requests);
  updateRequestsBadge();
}

function renderRequests(){
  var cont = document.getElementById('requests-container');
  cont.innerHTML = '';
  if (requests.length === 0) {
    cont.innerHTML = '<p class="status-msg">Заявок пока нет.<br>Добавьте товары в корзину и нажмите «Оформить заявку».</p>';
    return;
  }
  requests.forEach(function(r){
    var c = document.createElement('div'); c.className = 'card';
    var t = document.createElement('div'); t.className = 'card-title'; t.textContent = 'Накладная № ' + r.number + ' от ' + r.date;
    var s = document.createElement('div'); s.className = 'card-sub';
    s.textContent = 'Позиций: ' + r.items.length + ' · На сумму: ' + fmtMoney(r.total) + (r.buyer ? ' · Покупатель: ' + r.buyer : '');
    var acts = document.createElement('div'); acts.className = 'card-actions';
    var open = document.createElement('button'); open.className = 'btn'; open.textContent = 'Открыть накладную';
    open.onclick = function(){ openInvoice(r.id); };
    var del = document.createElement('button'); del.className = 'btn red'; del.textContent = '🗑 Удалить';
    del.onclick = function(){ deleteRequest(r.id); };
    acts.appendChild(open); acts.appendChild(del);
    c.appendChild(t); c.appendChild(s); c.appendChild(acts);
    cont.appendChild(c);
  });
}

function deleteRequest(id){
  var r = null;
  for (var i = 0; i < requests.length; i++) if (requests[i].id === id) r = requests[i];
  if (!r) { toast('Заявка не найдена'); return; }
  if (!confirm('Удалить накладную № ' + r.number + '?')) return;
  requests = requests.filter(function(x){ return x.id !== id; });
  saveRequests();
  if (currentOrderId === id) { currentOrderId = null; showView('requests'); }
  toast('Заявка удалена');
}

function getOrder(id){
  for (var i = 0; i < requests.length; i++) if (requests[i].id === id) return requests[i];
  return null;
}
function openInvoice(id){
  currentOrderId = id; editing = false;
  showView('invoice'); renderInvoice();
}

  h += '</table>';
  var total = o.items.reduce(function(s, it){ return s + it.qty * it.price; }, 0);
  h += '<div class="inv-total">Итого: ' + fmtMoney(total) + '</div>';
  h += '<div class="inv-vat">В том числе НДС: 0</div>';
  h += '<div class="inv-sumline">Всего наименований ' + o.items.length + ', на сумму ' + fmtMoney(total) + ' руб.</div>';
  h += '<div class="inv-words">' + rubText(total) + '</div>';
  if (editing) {
    h += '<div class="inv-sign"><span>Отпустил <input class="inv-inp" id="f-released" value="' + escAttr(o.releasedBy) + '" style="max-width:150px"></span>' +
      '<span>Получил <input class="inv-inp" id="f-received" value="' + escAttr(o.receivedBy) + '" style="max-width:150px"></span></div>';
    h += '<div class="btn-row no-print"><button class="btn green" onclick="saveInvoiceEdits()">💾 Сохранить</button>' +
      '<button class="btn gray" onclick="cancelEdit()">Отмена</button></div>';
  } else {
    h += '<div class="inv-sign"><span>Отпустил ' + escHtml(o.releasedBy || '') + '</span><span>Получил ' + escHtml(o.receivedBy || '') + '</span></div>';
  }
  body.innerHTML = h;
  if (editing) {
    body.querySelectorAll('.inp-qty,.inp-price').forEach(function(el){
      el.addEventListener('input', recalcInvoice);
    });
  }
}
function recalcInvoice(){
  var o = getOrder(currentOrderId); if (!o) return;
  var total = 0;
  o.items.forEach(function(it, i){
    var q = parseFloat((document.querySelector('.inp-qty[data-i="' + i + '"]') || {}).value || '0');
    var p = parseFloat((document.querySelector('.inp-price[data-i="' + i + '"]') || {}).value || '0');
    q = isNaN(q) ? 0 : q; p = isNaN(p) ? 0 : p;
    var cell = document.getElementById('sum-' + i);
    if (cell) cell.textContent = fmtMoney(q * p);
    total += q * p;
  });
  var t = document.querySelector('#view-invoice .inv-total');
  if (t) t.textContent = 'Итого: ' + fmtMoney(total);
  var s = document.querySelector('#view-invoice .inv-sumline');
  if (s) s.textContent = 'Всего наименований ' + o.items.length + ', на сумму ' + fmtMoney(total) + ' руб.';
  var w = document.querySelector('#view-invoice .inv-words');
  if (w) w.textContent = rubText(total);
}
function startEdit(){ editing = true; renderInvoice(); }
function cancelEdit(){ editing = false; renderInvoice(); }
function saveInvoiceEdits(){
  var o = getOrder(currentOrderId); if (!o) return;
  o.supplier = val('f-supplier', o.supplier);
  o.buyer = val('f-buyer', o.buyer);
  o.releasedBy = val('f-released', o.releasedBy);
  o.receivedBy = val('f-received', o.receivedBy);
  o.items.forEach(function(it, i){
    var nm = document.querySelector('.inp-name[data-i="' + i + '"]');
    var q = parseFloat((document.querySelector('.inp-qty[data-i="' + i + '"]') || {}).value || '0');
    var p = parseFloat((document.querySelector('.inp-price[data-i="' + i + '"]') || {}).value || '0');
    var u = document.querySelector('.inp-unit[data-i="' + i + '"]');
    if (nm) it.name = nm.value;
    it.qty = isNaN(q) ? it.qty : q;
    it.price = isNaN(p) ? it.price : p;
    if (u) it.unit = u.value;
  });
  o.total = o.items.reduce(function(s, it){ return s + it.qty * it.price; }, 0);
  saveRequests(); editing = false; renderInvoice(); toast('Накладная сохранена');
}
function val(id, fallback){ var e = document.getElementById(id); return e ? e.value.trim() : fallback; }

function printInvoice(){ window.print(); }
function downloadInvoice(){
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Накладная</title></head><body>' +
    document.getElementById('invoice-body').innerHTML.replace(/<input[^>]*>/g, function(m){
      return (m.match(/value="([^"]*)"/) || [null, ''])[1];
    }).replace(/<select[^>]*>[\s\S]*?<\/select>/g, '') +
    '</body></html>';
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  saveBlob(blob, 'nakladnaya_' + (getOrder(currentOrderId) || {}).number + '.html');
}
function emailInvoice(){
  var o = getOrder(currentOrderId); if (!o) return;
  var body = invoiceText(o);
  var url = 'mailto:?subject=' + encodeURIComponent('Накладная № ' + o.number + ' от ' + o.date) +
    '&body=' + encodeURIComponent(body);
  window.location.href = url;
}
function shareInvoice(){
  var o = getOrder(currentOrderId); if (!o) return;
  var text = invoiceText(o);
  if (navigator.share) navigator.share({ title: 'Накладная № ' + o.number, text: text }).catch(function(){});
  else copyText(text);
}
function copyText(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast('Скопировано'); }, function(){ fallbackCopy(text); });
  else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand('copy'); toast('Скопировано'); } catch(e){}
  document.body.removeChild(ta);
}
function saveBlob(blob, name){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 100);
}
function xmlEscape(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function export1C(){
  var o = getOrder(currentOrderId); if (!o) return;
  var x = '<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07" ДатаФормирования="' + o.date.split('.').reverse().join('-') + '">\n<Документ>\n';
  x += '<Ид>' + xmlEscape(o.id) + '</Ид>\n<Номер>' + o.number + '</Номер>\n<Дата>' + o.date.split('.').reverse().join('-') + '</Дата>\n';
  x += '<Контрагенты><Контрагент><Наименование>' + xmlEscape(o.buyer || 'Покупатель') + '</Наименование><Роль>Покупатель</Роль></Контрагент></Контрагенты>\n';
  x += '<Товары>\n';
  o.items.forEach(function(it){
    x += '<Товар><Наименование>' + xmlEscape(it.name) + '</Наименование><БазоваяЕдиница Код="796" НаименованиеКраткое="' + (it.unit === 'кг' ? 'КГ' : 'ШТ') + '">' + it.unit + '</БазоваяЕдиница>' +
      '<Количество>' + (Math.round(it.qty * 1000) / 1000) + '</Количество><ЦенаЗаЕдиницу>' + (Math.round(it.price * 100) / 100) + '</ЦенаЗаЕдиницу>' +
      '<Сумма>' + (Math.round(it.qty * it.price * 100) / 100) + '</Сумма></Товар>\n';
  });
  x += '</Товары>\n<СуммаИтог>' + (Math.round(o.total * 100) / 100) + '</СуммаИтог>\n</Документ>\n</КоммерческаяИнформация>';
  saveBlob(new Blob([x], { type: 'application/xml;charset=utf-8' }), 'nakladnaya_' + o.number + '_1c.xml');
  toast('XML для 1С сохранён');
}
function invoiceText(o){
  var t = 'Реализация товаров № ' + o.number + ' от ' + o.date + '\n';
  t += 'Поставщик: ' + (o.supplier || 'поставщик') + '\nПокупатель: ' + (o.buyer || '') + '\n\n';
  o.items.forEach(function(it, i){
    t += (i + 1) + '. ' + it.name + ' — ' + fmtQty(it.qty) + ' ' + it.unit + ' × ' + fmtMoney(it.price) + ' = ' + fmtMoney(it.qty * it.price) + '\n';
  });
  t += '\nИтого: ' + fmtMoney(o.total) + '\nВ том числе НДС: 0\n' + rubText(o.total) + '\n';
  t += 'Отпустил: ' + (o.releasedBy || '') + '   Получил: ' + (o.receivedBy || '');
  return t;
}

function openSettings(){
  document.getElementById('set-supplier').value = settings.supplier || '';
  document.getElementById('set-buyer').value = settings.buyer || '';
  document.getElementById('set-released').value = settings.releasedBy || '';
  document.getElementById('set-number').value = invoiceNum;
  document.getElementById('settings-modal').classList.add('active');
}
function closeSettings(){ document.getElementById('settings-modal').classList.remove('active'); }
function saveSettings(){
  settings.supplier = val('set-supplier', '') ;
  settings.buyer = val('set-buyer', '');
  settings.releasedBy = val('set-released', '');
  var n = parseInt(document.getElementById('set-number').value, 10);
  if (!isNaN(n) && n > 0) invoiceNum = n;
  settings.nextNum = invoiceNum;
  lsSet('catalog_order_settings', settings);
  lsSet('katalog_order_settings', settings);
  localStorage.setItem('catalog_invoice_num', String(invoiceNum));
  closeSettings(); toast('Настройки сохранены');
}
document.getElementById('settings-modal').addEventListener('click', function(e){
  if (e.target === this) closeSettings();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeSettings();
});

function fmtMoney(n){
  return n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtQty(n){
  var r = Math.round(n * 1000) / 1000;
  return r.toLocaleString('ru-RU', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
function fmtQtyPlain(n){ return String(Math.round(n * 1000) / 1000).replace('.', ','); }
function fmtDate(d){
  return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
}
function escHtml(s){ return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g, '&quot;'); }
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

var W_ONES = ['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
var W_ONEF = ['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'];
var W_TEENS = ['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
var W_TENS = ['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
var W_HUND = ['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
function triplet(n, fem){
  var out = [];
  var h = Math.floor(n / 100), rest = n % 100;
  if (h > 0) out.push(W_HUND[h]);
  if (rest >= 10 && rest < 20) out.push(W_TEENS[rest - 10]);
  else {
    var t = Math.floor(rest / 10), o = rest % 10;
    if (t > 0) out.push(W_TENS[t]);
    if (o > 0) out.push(fem ? W_ONEF[o] : W_ONES[o]);
  }
  return out.join(' ');
}
function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function numToWords(n){
  if (n === 0) return 'ноль';
  var parts = [];
  var mil = Math.floor(n / 1000000), th = Math.floor((n % 1000000) / 1000), r = n % 1000;
  if (mil > 0) parts.push(triplet(mil, false), plural(mil, 'миллион', 'миллиона', 'миллионов'));
  if (th > 0) parts.push(triplet(th, true), plural(th, 'тысяча', 'тысячи', 'тысяч'));
  if (r > 0 || parts.length === 0) parts.push(triplet(r, false));
  return parts.join(' ');
}
function rubText(sum){
  var rub = Math.floor(sum + 0.000001);
  var kop = Math.round((sum - rub) * 100);
  if (kop === 100) { rub += 1; kop = 0; }
  var words = numToWords(rub);
  words = words.charAt(0).toUpperCase() + words.slice(1);
  return words + ' ' + plural(rub, 'рубль', 'рубля', 'рублей') + ' ' + ('0' + kop).slice(-2) + ' ' + plural(kop, 'копейка', 'копейки', 'копеек');
}
