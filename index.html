<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6fe0">
<title>Каталог</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--blue:#1a6fe0;--blue-d:#1558b3;--bg:#eef2f7;--card:#fff;--txt:#1d2733;--mut:#7b8794;--ok:#188038;--bad:#c5221f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px}
header{background:var(--blue);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin-bottom:10px}
nav{display:flex;gap:8px;flex-wrap:wrap}
.navbtn{border:0;border-radius:22px;padding:10px 16px;font-size:15px;font-weight:600;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;min-height:44px}
.navbtn.active{background:#fff;color:var(--blue)}
.navbtn .badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:10px;background:#fff;color:var(--blue);font-size:12px}
main{max-width:680px;margin:0 auto;padding:12px}
#errbox{display:none;position:fixed;left:10px;right:10px;bottom:76px;background:#c5221f;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;z-index:99;white-space:pre-wrap}
.search{width:100%;padding:12px 14px;border:1.5px solid #d4dbe3;border-radius:12px;font-size:16px;background:#fff;outline:none}
.search:focus{border-color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1.5px solid #d4dbe3;background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--txt)}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.count{color:var(--mut);font-size:13px;margin:6px 2px}
.card{background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.picon{width:44px;height:44px;border-radius:10px;background:#f1f4f8;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pinfo{min-width:0}
.pname{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.pmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:3px}
.pprice{color:var(--txt);font-weight:600}
.pstock{font-size:12.5px;margin-top:2px}
.stock-ok{color:var(--ok)} .stock-bad{color:var(--bad)} .stock-none{color:var(--mut)}
.pctrl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.qtyrow{display:flex;align-items:center;gap:6px}
.qbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid #d4dbe3;background:#fff;font-size:18px;font-weight:700;color:var(--blue);cursor:pointer}
.qbtn:active{background:#e8f0fe}
.qinp{width:48px;height:36px;text-align:center;border:1.5px solid #d4dbe3;border-radius:10px;font-size:15px}
.addbtn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.addbtn:disabled{background:#b9c6d4;cursor:default}
.morebtn{width:100%;padding:12px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin:8px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:15px}
/* корзина */
.cartrow{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.cartrow .nm{font-size:14.5px;font-weight:600;flex:1;word-break:break-word}
.cartrow .sm{font-size:14px;font-weight:700;white-space:nowrap}
.totalbox{background:#fff;border-radius:12px;padding:14px;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.totalbox b{font-size:19px}
.abtn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
.abtn.secondary{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.abtn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
/* заявки */
.ordrow{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ordhead{display:flex;align-items:center;gap:10px}
.ordrow input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
.ordmain{flex:1;cursor:pointer;min-width:0}
.ordtitle{font-size:15px;font-weight:700;color:var(--blue)}
.ordsub{font-size:13px;color:var(--mut);margin-top:2px}
.delbtn{border:1.5px solid #f1c7c5;color:var(--bad);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.bulkbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bulkbar .abtn{margin:0;width:auto;padding:10px 14px;font-size:14px}
.linklike{background:none;border:0;color:var(--blue);font-size:14px;font-weight:600;cursor:pointer}
/* накладная */
.inv{background:#fff;border-radius:14px;padding:16px 14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.inv h2{font-size:18px;margin-bottom:10px}
.invtable{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.invtable th,.invtable td{border:1px solid #444;padding:5px 6px;vertical-align:top}
.invtable th{background:#f1f4f8;text-align:center}
.invtable .num{text-align:right;white-space:nowrap}
.invtable .qty{text-align:right;white-space:nowrap}
.invrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.invrow label{min-width:110px;color:var(--mut)}
.invrow input{flex:1;min-width:140px;border:1.5px solid #d4dbe3;border-radius:8px;padding:8px 10px;font-size:15px}
.invactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.big{font-size:15px;text-align:right}
.verbal{font-weight:700;margin-top:4px}
/* модалка */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.modal h3{margin-bottom:12px}
.modal .invrow input{width:100%;flex:none}
.modal .close{float:right;border:0;background:#f1f4f8;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:120;display:none}
@media print{
 header,nav,.search,.chips,.invactions,.addbtn,.qbtn,.qinp,.bulkbar,.delbtn,.morebtn,.pctrl,.picon,.toast,#errbox{display:none!important}
 body{background:#fff;padding:0}
 .card{box-shadow:none;border-bottom:1px solid #ddd;border-radius:0;grid-template-columns:1fr}
 .inv{box-shadow:none;border:0}
 .invactions{display:none!important}
}
</style>
</head>

 h+='<div class="bulkbar"><button class="linklike" data-act="selall">Выбрать все</button>'
  +'<button class="abtn danger" data-act="delchecked">🗑 Удалить выбранные (<span id="chkCount">'+Object.keys(checked).length+'</span>)</button></div>';
 for(var i=0;i<orders.length;i++){
  var o=orders[i];
  h+='<div class="ordrow"><div class="ordhead">'
   +'<input type="checkbox" data-act="chk" data-id="'+i+'"'+(checked[i]?' checked':'')+'>'
   +'<div class="ordmain" data-act="openord" data-id="'+i+'"><div class="ordtitle">Реализация товаров № '+esc(o.num)+' от '+esc(o.date)+'</div>'
   +'<div class="ordsub">Позиций: '+o.items.length+' · Сумма: '+fmt(o.total)+' ₽</div></div>'
   +'<button class="delbtn" data-act="delord" data-id="'+i+'">🗑</button></div></div>';
 }
 return h;
}
function htmlOrder(){
 var o=orders[curOrder];
 if(!o) return '<div class="empty">Заявка не найдена.</div>';
 function rows(edit){
  var h='', total=0;
  for(var i=0;i<o.items.length;i++){
   var r=o.items[i], sum=r.price*r.qty; total+=sum;
   if(edit){
    h+='<tr><td>'+(i+1)+'</td><td><input data-act="editName" data-i="'+i+'" value="'+esc(r.name)+'" style="width:100%;border:1px solid #ccc;padding:3px"></td>'
     +'<td class="qty"><input data-act="editQty" data-i="'+i+'" value="'+r.qty+'" style="width:60px;text-align:right;border:1px solid #ccc;padding:3px"></td>'
     +'<td><select data-act="editUnit" data-i="'+i+'"><option'+(r.unit==='шт'?' selected':'')+'>шт</option><option'+(r.unit==='кг'?' selected':'')+'>кг</option></select></td>'
     +'<td class="qty"><input data-act="editPrice" data-i="'+i+'" value="'+r.price+'" style="width:70px;text-align:right;border:1px solid #ccc;padding:3px"></td>'
     +'<td class="num">'+fmt(sum)+'</td></tr>';
   } else {
    h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td class="qty">'+fmt(r.qty)+'</td><td>'+esc(r.unit)+'</td><td class="qty">'+fmt(r.price)+'</td><td class="num">'+fmt(sum)+'</td></tr>';
   }
  }
  return {h:h,total:total};
 }
 var r=rows(editMode), total=r.total;
 var h='<div class="inv"><h2>Реализация товаров № '+esc(o.num)+' от '+esc(o.date)+' г.</h2>'
  +'<div class="invrow"><label>Поставщик:</label>'+(editMode?'<input data-act="editSupplier" value="'+esc(o.supplier)+'">':'<b>'+esc(o.supplier)+'</b>')+'</div>'
  +'<div class="invrow"><label>Покупатель:</label>'+(editMode?'<input data-act="editBuyer" value="'+esc(o.buyer)+'">':'<b>'+esc(o.buyer)+'</b>')+'</div>'
  +'<table class="invtable"><tr><th>№</th><th>Товар</th><th>Количество</th><th></th><th>Цена</th><th>Сумма</th></tr>'+r.h+'</table>'
  +'<div class="big">Итого: <b>'+fmt(total)+'</b></div>'
  +'<div class="big">В том числе НДС: <b>0</b></div>'
  +'<div style="margin-top:10px;font-size:13px">Всего наименований '+o.items.length+', на сумму '+fmt(total)+' руб.</div>'
  +'<div class="verbal">'+rubText(total)+'</div>'
  +'<div style="display:flex;gap:20px;margin-top:16px;font-size:14px"><div>Отпустил ____________ '+(editMode?'<input data-act="editReleased" value="'+esc(o.releasedBy)+'" style="width:130px">':esc(o.releasedBy))+'</div><div>Получил ____________ '+(editMode?'<input data-act="editReceived" value="'+esc(o.receivedBy||'')+'" style="width:130px">':esc(o.receivedBy||''))+'</div></div>'
  +'</div>'
  +'<div class="invactions">'
  +'<button class="abtn secondary" data-act="back">← Назад</button>'
  +(editMode?'<button class="abtn" data-act="saveedit">💾 Сохранить</button>':'<button class="abtn secondary" data-act="editmode">✏️ Редактировать</button>')
  +'<button class="abtn secondary" data-act="print">🖨 Печать / PDF</button>'
  +'<button class="abtn secondary" data-act="download">⬇ Скачать</button>'
  +'<button class="abtn secondary" data-act="email">✉ Email</button>'
  +'<button class="abtn secondary" data-act="share">↗ Поделиться</button>'
  +'<button class="abtn secondary" data-act="export1c">📊 Экспорт для 1С</button>'
  +'</div>';
 return h;
}

/* ---------- действия ---------- */
function setQty(id,q){
 q=Math.max(0,Number(q)||0);
 var it=IDX[id]; if(!it) return;
 if(q===0) delete cart[id];
 else {
  var st=stockOf(id);
  if(st!=null&&q>st){ toast('Недостаточно товара на складе'); q=st; }
  cart[id]={qty:q};
 }
 saveAll(); updateBadge();
}
function addToCart(id){
 var it=IDX[id]; if(!it) return;
 var inp=document.querySelector('.qinp[data-id="'+id+'"]');
 var q=inp?Number(inp.value)||0:0;
 var st=stockOf(id);
 if(st!=null&&st<=0){ toast('Нет в наличии'); return; }
 if(q<=0){ toast('Укажите количество'); if(inp) inp.focus(); return; }
 if(st!=null&&q>st){ toast('Недостаточно товара на складе'); q=st; }
 setQty(id,q);
 toast('Добавлено в корзину: '+q);
 render();
}
function checkout(){
 var cl=cartList();
 if(!cl.length){ toast('Корзина пуста'); return; }
 var items=[], total=0;
 for(var i=0;i<cl.length;i++){
  var it=IDX[cl[i].id]; if(!it) continue;
  var unit=(/кг/i.test(it.n)||/ВЕС/i.test(it.n))?'кг':'шт';
  items.push({name:it.n,qty:cl[i].qty,unit:unit,price:it.p||0});
  total+=(it.p||0)*cl[i].qty;
  if(it.s!=null) it.s=Math.max(0,it.s-cl[i].qty);  // списание остатка
 }
 var num=settings.startNum||35157;
 settings.startNum=num+1;
 var d=new Date(), date=d.getDate()+'.'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'.'+d.getFullYear();
 var order={num:num,date:date,supplier:settings.supplier||'поставщик',buyer:settings.buyer||'',releasedBy:settings.releasedBy||'',receivedBy:'',items:items,total:total};
 orders.unshift(order);
 cart={}; checked={};
 saveAll();
 view='order'; curOrder=0; editMode=false;
 toast('Заявка № '+num+' оформлена');
 render();
}
function saveSettings(){
 var g=function(id){ var el=$(id); return el?el.value:''; };
 settings.supplier=g('setSupplier')||settings.supplier;
 settings.buyer=g('setBuyer')||settings.buyer;
 settings.releasedBy=g('setReleased')||settings.releasedBy;
 var sn=parseInt(g('setStart'),10); if(!isNaN(sn)&&sn>0) settings.startNum=sn;
 saveAll();
 closeModal();
 toast('Настройки сохранены');
}
function deleteOrder(i){ orders.splice(i,1); delete checked[i]; saveAll(); toast('Заявка удалена'); render(); }
function deleteChecked(){
 var ids=Object.keys(checked).map(Number).filter(function(x){return x<orders.length;});
 if(!ids.length){ toast('Ничего не выбрано'); return; }
 if(!confirm('Удалить выбранные заявки ('+ids.length+')?')) return;
 ids.sort(function(a,b){return b-a;});
 for(var j=0;j<ids.length;j++) orders.splice(ids[j],1);
 checked={}; saveAll(); toast('Удалено: '+ids.length); render();
}
function downloadOrder(){
 try{
  var o=orders[curOrder]; if(!o) return;
  var blob=new Blob([orderText(o)],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='nakladnaya_'+o.num+'.txt'; a.click();
  toast('Файл скачан');
 }catch(e){ showErr(e.message); }
}
function emailOrder(){
 var o=orders[curOrder]; if(!o) return;
 var body=encodeURIComponent(orderText(o));
 location.href='mailto:?subject='+encodeURIComponent('Накладная № '+o.num)+'&body='+body;
}
function shareOrder(){
 var o=orders[curOrder]; if(!o) return;
 var text=orderText(o);
 if(navigator.share) navigator.share({title:'Накладная № '+o.num,text:text}).catch(function(){});
 else { try{ navigator.clipboard.writeText(text); toast('Скопировано в буфер'); }catch(e){ toast('Не удалось скопировать'); } }
}
function export1c(){
 try{
  var o=orders[curOrder]; if(!o) return;
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<КоммерческаяИнформация ВерсияСхемы="2.07" ДатаФормирования="'+new Date().toISOString().slice(0,10)+'">\n <Документ>\n  <Номер>'+o.num+'</Номер>\n  <Дата>'+o.date.split('.').reverse().join('-')+'</Дата>\n  <Контрагенты><Контрагент><Наименование>'+esc(o.buyer)+'</Наименование><Роль>Покупатель</Роль></Контрагент></Контрагенты>\n  <Товары>\n';
  for(var i=0;i<o.items.length;i++){ var r=o.items[i];
   x+='   <Товар><Наименование>'+esc(r.name)+'</Наименование><Количество>'+r.qty+'</Количество><Единица>'+r.unit+'</Единица><Цена>'+r.price+'</Цена><Сумма>'+(r.qty*r.price).toFixed(2)+'</Сумма></Товар>\n'; }
  x+='  </Товары>\n  <СуммаДокумента>'+o.total.toFixed(2)+'</СуммаДокумента>\n </Документ>\n</КоммерческаяИнформация>';
  var blob=new Blob([x],{type:'application/xml;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='nakladnaya_'+o.num+'.xml'; a.click();
  toast('XML для 1С скачан');
 }catch(e){ showErr(e.message); }
}
function orderText(o){
 var t='Реализация товаров № '+o.num+' от '+o.date+' г.\n';
 t+='Поставщик: '+o.supplier+'\nПокупатель: '+o.buyer+'\n';
 t+='№ | Товар | Кол-во | Ед | Цена | Сумма\n';
 for(var i=0;i<o.items.length;i++){ var r=o.items[i];
  t+=(i+1)+'. '+r.name+' — '+r.qty+' '+r.unit+' × '+r.price+' = '+(r.qty*r.price).toFixed(2)+'\n'; }
 t+='Итого: '+o.total.toFixed(2)+'\nВ том числе НДС: 0\nВсего наименований '+o.items.length+', на сумму '+o.total.toFixed(2)+' руб.\n'+rubText(o.total)+'\n';
 t+='Отпустил ____________ '+o.releasedBy+'    Получил ____________ '+(o.receivedBy||'');
 return t;
}

/* ---------- модалка настроек ---------- */
function openModal(html){ $('modalBox').innerHTML=html; $('modalBg').classList.add('open'); }
function closeModal(){ $('modalBg').classList.remove('open'); }
function showSettings(){
 openModal('<button class="close" data-mact="close">✕</button><h3>⚙️ Настройки накладных</h3>'
  +'<div class="invrow"><label>Поставщик</label><input id="setSupplier" value="'+esc(settings.supplier)+'"></div>'
  +'<div class="invrow"><label>Покупатель</label><input id="setBuyer" value="'+esc(settings.buyer)+'"></div>'
  +'<div class="invrow"><label>Отпустил</label><input id="setReleased" value="'+esc(settings.releasedBy)+'"></div>'
  +'<div class="invrow"><label>Старт. номер</label><input id="setStart" type="number" value="'+esc(settings.startNum)+'"></div>'
  +'<button class="abtn" data-mact="savesettings">💾 Сохранить</button>');
}

/* ---------- обработчики ---------- */
document.addEventListener('click', function(e){
 var t=e.target.closest('[data-act],[data-nav],[data-mact],[data-cat]');
 if(!t) return;
 try{
  if(t.hasAttribute('data-nav')){ view=t.getAttribute('data-nav'); shown=0; render(); return; }
  if(t.hasAttribute('data-cat')){ curCat=t.getAttribute('data-cat'); shown=0; render(); return; }
  if(t.hasAttribute('data-mact')){
   var ma=t.getAttribute('data-mact');
   if(ma==='close') closeModal();
   if(ma==='savesettings') saveSettings();
   return;
  }
  var act=t.getAttribute('data-act'), id=+(t.getAttribute('data-id')||0);
  switch(act){
   case 'inc': { var inp=document.querySelector('.qinp[data-id="'+id+'"]'); if(inp) inp.value=(Number(inp.value)||0)+1; break; }
   case 'dec': { var inp2=document.querySelector('.qinp[data-id="'+id+'"]'); if(inp2) inp2.value=Math.max(0,(Number(inp2.value)||0)-1); break; }
   case 'input': break;
   case 'add': addToCart(id); break;
   case 'cartdel': { var it=IDX[id]; if(cart[id]&&it&&it.s!=null) it.s=it.s+cart[id].qty; delete cart[id]; saveAll(); updateBadge(); render(); break; }
   case 'checkout': checkout(); break;
   case 'clearcart': { var cl=cartList(); for(var j=0;j<cl.length;j++){ var it2=IDX[cl[j].id]; if(it2&&it2.s!=null) it2.s=it2.s+cl[j].qty; } cart={}; saveAll(); render(); break; }
   case 'more': shown+=PAGE; render(); break;
   case 'selall': { var all=document.querySelectorAll('input[type=checkbox][data-act=chk]'); var allCh=true; for(var a=0;a<all.length;a++) if(!all[a].checked) allCh=false; for(var b=0;b<all.length;b++){ all[b].checked=!allCh; checked[+all[b].getAttribute('data-id')]=!allCh; } $('chkCount').textContent=Object.keys(checked).length; break; }
   case 'chk': { checked[id]=t.checked; var c=$('chkCount'); if(c) c.textContent=Object.keys(checked).length; break; }
   case 'delchecked': deleteChecked(); break;
   case 'delord': { if(confirm('Удалить заявку?')) deleteOrder(id); break; }
   case 'openord': curOrder=id; editMode=false; view='order'; render(); break;
   case 'back': view='orders'; editMode=false; render(); break;
   case 'editmode': editMode=true; render(); break;
   case 'saveedit': { var o=orders[curOrder]; for(var k=0;k<o.items.length;k++){ var g=function(a,i2){ var el=document.querySelector('[data-act="'+a+'"][data-i="'+i2+'"]'); return el?el.value:null; }; var qn=parseFloat(g('editQty',k)); if(!isNaN(qn)) o.items[k].qty=qn; var pr=parseFloat(g('editPrice',k)); if(!isNaN(pr)) o.items[k].price=pr; var un=g('editUnit',k); if(un) o.items[k].unit=un; var nm=g('editName',k); if(nm) o.items[k].name=nm; } var gg=function(a){ var el=document.querySelector('[data-act="'+a+'"]'); return el?el.value:null; }; var sup=gg('editSupplier'); if(sup!=null) o.supplier=sup; var bu=gg('editBuyer'); if(bu!=null) o.buyer=bu; var rel=gg('editReleased'); if(rel!=null) o.releasedBy=rel; var rec=gg('editReceived'); if(rec!=null) o.receivedBy=rec; o.total=0; for(var m=0;m<o.items.length;m++) o.total+=o.items[m].qty*o.items[m].price; saveAll(); editMode=false; render(); toast('Сохранено'); break; }
   case 'print': window.print(); break;
   case 'download': downloadOrder(); break;
   case 'email': emailOrder(); break;
   case 'share': shareOrder(); break;
   case 'export1c': export1c(); break;
  }
 }catch(err){ showErr(err.message); }
});
document.addEventListener('input', function(e){
 var t=e.target;
 if(t.classList&&t.classList.contains('search')){ query=t.value; shown=0; render(); var sb=$('searchBox'); if(sb){ sb.focus(); sb.setSelectionRange(sb.value.length,sb.value.length); } }
 if(t.hasAttribute&&t.hasAttribute('data-act')&&t.getAttribute('data-act')==='input'){ setQty(+(t.getAttribute('data-id')||0),t.value); }
});
$('settingsBtn').addEventListener('click', function(){ showSettings(); });
$('modalBg').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

render();
</script>
